  text_helpdesk_auto_reply_sender_whitelist_info: "One address or domain per line. Auto-replies from these senders will still be processed."
  field_helpdesk_auto_reply_header_whitelist: Header exceptions
  text_helpdesk_auto_reply_header_whitelist_info: "One header-value pair per line (format: \"Header-Name: Value\" or \"Header-Name: *\"). Mails containing one of these headers will be processed despite auto-reply indicators."

