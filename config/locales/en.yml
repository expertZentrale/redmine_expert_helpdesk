  label_helpdesk_legacy_import: 'Import from redmine_contacts'
  text_helpdesk_legacy_import_info: 'The database contains %{count} contacts from the legacy redmine_contacts / redmine_contacts_helpdesk plugin (tables contacts, contacts_projects, helpdesk_tickets). The import migrates contacts per project and links old issues via the authoritative customer mapping from helpdesk_tickets so the customer card appears there. Correct existing links are skipped, wrong synthetic links from earlier import runs are repaired.'
  button_helpdesk_legacy_import: 'Import contacts now'
  text_helpdesk_legacy_import_confirm: 'Import contacts and issue links from redmine_contacts? The operation is idempotent (safe to repeat).'
  notice_helpdesk_legacy_import_done: 'Import completed: %{created} contacts created, %{existing} already existed, %{links} issues linked, %{repaired} links repaired, %{skipped} issues skipped.'
  error_helpdesk_legacy_import_no_data: 'No legacy data found (contacts table missing or empty).'
  error_helpdesk_legacy_import_failed: 'Import failed: %{message}'
  label_helpdesk_legacy_import_select: 'Select projects to import'
  text_helpdesk_legacy_import_select_info: 'Choose which projects'' legacy contacts to import. Unused old projects can be left unchecked. The number in parentheses is the count of legacy contacts for that project.'
  label_helpdesk_legacy_select_all: 'Select all'
  label_helpdesk_legacy_no_project: '(no project assignment)'
