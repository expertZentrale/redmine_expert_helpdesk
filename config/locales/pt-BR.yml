  # AI summaries
  label_helpdesk_ai_settings: "Resumos de IA"
  field_helpdesk_ai_enabled: "Ativar resumos de IA"
  text_helpdesk_ai_enabled_info: "Chave geral. Os resumos também precisam ser ativados em cada projeto."
  field_helpdesk_ai_provider: "Provedor"
  label_helpdesk_ai_provider_openai: "OpenAI"
