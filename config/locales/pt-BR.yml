  field_helpdesk_info_request_note_visibility: "Nota no histórico sobre o pedido"
  label_helpdesk_info_request_note_public: "Pública (o cliente também vê)"
  label_helpdesk_info_request_note_private: "Interna (somente agentes)"
  text_helpdesk_info_request_note_visibility_info: "A nota registra que um pedido de informações foi enviado e o que foi perguntado. Pública mantém agente e cliente com o mesmo registro; interna exige a permissão “Ver notas privadas”."
  text_helpdesk_info_request_enabled_info: "Chave geral. Quando desativada, nenhum projeto executa a verificação, independentemente da configuração dele."
  text_helpdesk_info_request_mode_info: "Verifica apenas o PRIMEIRO e-mail de um novo ticket. “Baseado em regras” funciona sem IA; “Com IA” requer as configurações de IA acima."
  text_helpdesk_info_request_globally_off: "A verificação de completude está desativada centralmente (Administração → Plugins), portanto estas configurações ainda não têm efeito."
  text_helpdesk_info_request_ai_unavailable: "A IA está desativada centralmente, portanto “Com IA” não pode ser executado. Use o modo baseado em regras ou ative a IA primeiro."
  text_helpdesk_info_request_min_chars_info: "E-mails mais curtos que isso contam como incompletos. O histórico citado e as assinaturas são removidos antes da medição. 0 desativa esta regra."
  text_helpdesk_info_request_min_words_info: "O mesmo que acima, contado em palavras. 0 desativa esta regra."
  text_helpdesk_info_request_require_attachment_info: "Considerar incompleto um e-mail sem nenhum anexo (captura de tela, log, foto)."
  field_helpdesk_info_request_min_attachment_kb: "Tamanho mínimo de imagem"
  text_helpdesk_info_request_min_attachment_kb_info: "Em KB. Imagens menores que isso não contam como captura de tela ou foto — logotipos de assinatura e pixels de rastreamento vêm em quase todo e-mail. Vale somente para imagens; um log ou PDF pequeno continua contando. 0 desativa o limite."
  field_helpdesk_info_request_sender_blacklist: "Nunca perguntar a estes remetentes"
  field_helpdesk_contact_info_request_opt_out: "Nunca pedir mais informações"
  label_helpdesk_contact_info_request_opt_out_short: "não perguntar"
  button_helpdesk_contact_info_request_stop: "nunca perguntar"
  button_helpdesk_contact_info_request_resume: "perguntar novamente"
  text_helpdesk_contact_info_request_resume_info: "Permitir que a verificação de completude volte a pedir a este cliente as informações que faltam."
  text_helpdesk_contact_info_request_opt_out_info: "Ninguém por trás deste endereço responde a um pedido de informações: relatórios de backup, alertas de monitoramento, e-mails de cron. Os tickets continuam sendo criados e verificados quanto à completude, mas o cliente nunca recebe e-mail sobre isso. A mesma decisão para um endereço ou domínio inteiro fica na configuração do projeto “Nunca perguntar a estes remetentes”."
  text_helpdesk_info_request_sender_blacklist_info: "Uma entrada por linha: endereço completo, domínio simples ou “@domínio”. Relatórios de backup, e-mails de cron e alertas de monitoramento são tickets reais, mas ninguém por trás deles pode responder a um pedido de informações. E-mails que se identificam como gerados por máquina nos cabeçalhos são ignorados automaticamente, mesmo sem uma entrada aqui: Auto-Submitted, Precedence (bulk, list, junk), X-Auto-Response-Suppress, X-MS-Exchange-Generated-Message-Source e os cabeçalhos X-Autoreply/X-Autorespond/X-Autoresponder. Notificações de falha na entrega (NDR) não são ignoradas."
  text_helpdesk_info_request_keywords_info: "Um termo por linha. O e-mail precisa conter pelo menos um deles; caso contrário, conta como incompleto. Vazio desativa esta regra."
  text_helpdesk_info_request_threshold_info: "Quantas regras precisam falhar antes de o cliente ser consultado. 1 = a primeira regra que falhar já dispara um pedido de informações."
  text_helpdesk_info_request_ai_prompt_info: "O modelo precisa responder com JSON ({\"complete\": true|false, \"missing\": [...]}). Qualquer resposta ilegível conta como completa, e então nenhum e-mail é enviado."
  text_helpdesk_info_request_subject_info: "Macros são permitidas. Vazio usa o padrão central."
  text_helpdesk_info_request_body_info: "Macros são permitidas. {{missing_info}} insere a lista das informações que faltam. Vazio usa o padrão central."
  text_helpdesk_info_request_status_info: "Opcional, por exemplo, “Aguardando cliente”. Vazio deixa a situação inalterada. Situações de fechamento não são oferecidas: fechar um ticket conta como reação e como solução para o SLA, e um pedido automático de informações não deve fazer isso."
  text_helpdesk_info_request_reason_too_short: "Uma breve descrição do problema (o que exatamente não está funcionando?)"
  text_helpdesk_info_request_reason_too_few_words: "Mais alguns detalhes sobre a sua solicitação"
  text_helpdesk_info_request_reason_no_attachment: "Uma captura de tela ou a mensagem de erro como arquivo, se houver"
  text_helpdesk_info_request_reason_no_keyword: "O sistema, aplicativo ou dispositivo afetado"
  note_helpdesk_info_request_sent: "Pedido automático de informações enviado para %{email}: o e-mail inicial não continha informações suficientes."
