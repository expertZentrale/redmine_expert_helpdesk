  field_helpdesk_ai_prompt_mode: "Modo do prompt"
  label_helpdesk_ai_prompt_mode_inherit: "Usar prompt central"
  label_helpdesk_ai_prompt_mode_extend: "Complementar prompt central"
  label_helpdesk_ai_prompt_mode_override: "Substituir pelo prompt do projeto"
  text_helpdesk_ai_prompt_mode_info: "Como o prompt do projeto abaixo se combina com o prompt padrão central."
  field_helpdesk_ai_attachments: "Enviar anexos à IA"
  label_helpdesk_ai_attach_metadata: "Nomes de arquivo / metadados"
  label_helpdesk_ai_attach_text: "Texto extraído (PDF, arquivos de texto)"
  label_helpdesk_ai_attach_images: "Imagens (requer modelo com visão)"
  text_helpdesk_ai_attachments_info: "Escolha quais informações dos anexos entram na entrada do resumo. Imagens exigem um modelo com suporte a visão."
  field_helpdesk_ai_min_image_kb: "Tamanho mínimo de imagem"
  text_helpdesk_ai_min_image_kb_info: "Em KB. Imagens menores não são enviadas ao modelo – logotipos de assinatura, ícones de redes sociais e pixels de rastreamento vêm em quase todo e-mail, custam tokens à toa e tiram a captura de tela real do orçamento de imagens. Imagens menores que 64x64 pixels também são ignoradas. Vale somente para imagens; o texto e os metadados dos anexos não são afetados. 0 desativa o limite."
  field_helpdesk_ai_include_journal: "Incluir o histórico completo do ticket"
  text_helpdesk_ai_include_journal_info: "Envia a conversa inteira (descrição + todas as notas) em vez de apenas o e-mail que disparou o resumo. As notas de resumo de IA do próprio plugin são excluídas."
  field_helpdesk_ai_include_private_notes: "Incluir também notas privadas"
  text_helpdesk_ai_include_private_notes_info: "Só se aplica quando o histórico completo é incluído. Observação: nesse caso, as notas privadas (internas) também são enviadas ao provedor de IA."
