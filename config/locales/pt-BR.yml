  text_helpdesk_kb_tab_info: "Pares problema/solução extraídos de tickets resolvidos. Somente as entradas aprovadas são usadas em sugestões e rascunhos de resposta. Salvar uma entrada recalcula o vetor dela – nunca edite entradas diretamente no banco vetorial."
  text_helpdesk_kb_problem_info: "Somente o texto do problema é usado na pesquisa por similaridade; escreva-o como um cliente descreveria a falha."
  text_helpdesk_kb_status_info: "As entradas aprovadas ficam pesquisáveis imediatamente; as pendentes são mantidas, mas não são usadas."
  text_helpdesk_kb_issue_id_info: "Ticket deste projeto no qual a entrada se baseia (uma entrada por ticket)."
  text_helpdesk_kb_reindex_info: "Limpa o armazenamento vetorial deste projeto e recalcula os embeddings de todas as entradas aprovadas (por exemplo, após trocar o modelo de embeddings)."
  text_helpdesk_kb_reindex_confirm: "Reconstruir o índice vetorial deste projeto? As sugestões podem ficar incompletas até a reconstrução terminar."
  text_helpdesk_kb_reject_confirm: "Rejeitar esta entrada? Ela é removida da pesquisa e não será recriada automaticamente quando o ticket for fechado novamente."
  text_helpdesk_kb_delete_confirm: "Excluir esta entrada permanentemente? O ticket pode ser incluído de novo na próxima vez que for fechado."
  text_helpdesk_kb_saved_not_indexed: "Salvo, mas não foi possível atualizar o vetor (armazenamento ou embeddings inacessíveis/não configurados). Use “Reconstruir índice” quando estiverem disponíveis."
  text_helpdesk_kb_problem_blank: "Salvo, mas não pesquisável: o texto do problema está vazio."
  text_helpdesk_kb_unindex_failed: "Não foi possível remover o vetor do armazenamento (inacessível). A entrada foi mantida; tente novamente ou use “Reconstruir índice” quando o armazenamento estiver disponível."
  notice_helpdesk_kb_saved_indexed: "Salvo e com embedding recalculado."
  notice_helpdesk_kb_reindex_queued: "Reconstrução do índice iniciada. Ela é executada em segundo plano."
  button_helpdesk_kb_reextract: "Extrair entradas novamente"
  text_helpdesk_kb_reextract_info: "Executa novamente a extração por IA das entradas no nível de detalhe atual. Entradas editadas, aprovadas ou rejeitadas por uma pessoa não são alteradas."
  text_helpdesk_kb_reextract_confirm: "%{count} entradas foram extraídas em outro nível de detalhe. Extraí-las novamente em “%{level}”? Isso custa uma chamada de IA por entrada."
  text_helpdesk_kb_reextract_confirm_all: "Extrair novamente todas as %{count} entradas (não editadas por uma pessoa) em “%{level}”, por exemplo, após uma mudança no prompt? Isso custa uma chamada de IA por entrada."
  notice_helpdesk_kb_reextract_queued: "Nova extração de %{count} entradas iniciada. Ela é executada em segundo plano; as entradas mantêm a situação atual."
  notice_helpdesk_kb_reextract_nothing: "Nenhuma entrada para extrair novamente."

