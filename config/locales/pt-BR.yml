  warning_helpdesk_sent_append_failed: "O e-mail foi enviado, mas não foi possível arquivar uma cópia na pasta de enviados: %{message}"
  text_helpdesk_reply_transport_info: "“Backend da caixa de correio” usa o que estiver configurado para a própria caixa de correio. A API do Graph só é oferecida para uma caixa de correio IMAP hospedada no Microsoft 365 (predefinição Microsoft em vigor) e requer um registro central de aplicativo no Azure configurado. SMTP usa as configurações SMTP da configuração do Redmine e não precisa de nenhuma credencial de e-mail na caixa de correio – observe que, nesse caso, as imagens incorporadas são inseridas como data URIs em vez de anexos CID. Respostas, e-mails iniciais e a resposta automática seguem esta configuração."
