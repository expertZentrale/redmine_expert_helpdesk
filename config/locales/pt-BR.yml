  field_helpdesk_autoresponder_body: "Texto"
  text_helpdesk_macros_info: "Macros disponíveis: {{issue.id}}, {{issue.subject}}, {{issue.url}}, {{issue.status}}, {{issue.priority}}, {{issue.tracker}}, {{issue.author}}, {{issue.assignee}}, {{issue.category}}, {{issue.version}}, {{issue.start_date}}, {{issue.due_date}}, {{issue.created_on}}, {{issue.updated_on}}, {{issue.done_ratio}}, {{issue.description}}, {{issue.parent_id}}, {{contact.name}}, {{contact.email}}, {{user.name}}, {{user.firstname}}, {{user.lastname}}, {{user.login}}, {{user.mail}}, {{project.name}}, {{project.identifier}}. Os campos personalizados de tarefa habilitados estão disponíveis como {{issue.cf.<name>}} ou {{issue.cf.<id>}}. A notação antiga ({{ticket_id}}, {{contact_name}}, ...) continua funcionando."
  field_helpdesk_smtp_from_address: "Remetente alternativo (From)"
  text_helpdesk_smtp_from_address_info: "Opcional. Vazio = envia como o endereço da caixa de correio. Usado somente quando as respostas passam pela configuração SMTP do próprio Redmine; o Graph e o servidor SMTP próprio da caixa de correio se autenticam como a caixa de correio e rejeitam um remetente diferente. O relay precisa ter permissão para enviar por este endereço (SPF/DMARC)."
  field_helpdesk_smtp_reply_to_mailbox: "Definir Reply-To como o endereço da caixa de correio"
  text_helpdesk_smtp_reply_to_mailbox_info: "Desativado por padrão. Deixe desativado quando o endereço do remetente já entrega de volta nesta caixa de correio — por exemplo, uma lista de distribuição cujo único membro é esta caixa de correio; nesse caso, um Reply-To só exporia o endereço interno. Ative quando os e-mails enviados ao endereço do remetente não chegam a esta caixa de correio; caso contrário, as respostas dos clientes nunca voltam ao ticket."
