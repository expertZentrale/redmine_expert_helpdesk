  field_helpdesk_ai_api_key: "Chave de API"
  field_helpdesk_ai_endpoint: "Endpoint (URL base)"
  text_helpdesk_ai_endpoint_info: "Deixe vazio para usar o padrão do provedor. Obrigatório para “Personalizado” (URL auto-hospedada compatível com OpenAI, por exemplo, Ollama/vLLM/LocalAI/LM Studio)."
  field_helpdesk_ai_model: "Modelo"
  text_helpdesk_ai_model_info: "ID do modelo. Para resumos, basta um modelo rápido e barato — por exemplo, OpenAI gpt-4o-mini ou gpt-5-nano, Anthropic claude-haiku-4-5, ou um modelo auto-hospedado como llama3.1. Os modelos OpenAI GPT-5 / série o são suportados. Anexos de imagem (visão) exigem um modelo com suporte a visão (por exemplo, gpt-4o-mini, gpt-5-nano, claude-haiku-4-5). Em modelos de raciocínio (GPT-5/série o), mantenha “Máx. de tokens de saída” razoavelmente alto."
  field_helpdesk_ai_prompt: "Prompt"
  text_helpdesk_ai_prompt_info: "Instrução padrão global. Os projetos podem complementá-la ou substituí-la."
  field_helpdesk_ai_max_input_chars: "Máx. de caracteres de entrada"
  field_helpdesk_ai_min_input_chars: "Mín. de caracteres de entrada"
  text_helpdesk_ai_max_input_chars_info: "O corpo do e-mail (e o texto dos anexos) é truncado para este tamanho antes do envio."
  text_helpdesk_ai_min_input_chars_info: "E-mails mais curtos que isso não passam pela IA; em vez disso, o texto original é publicado como nota. 0 = sempre resumir."
  field_helpdesk_ai_max_output_tokens: "Máx. de tokens de saída"
  field_helpdesk_ai_summary_disable_thinking: "Desativar o modo de raciocínio nos resumos"
  text_helpdesk_ai_summary_disable_thinking_info: "Pede aos modelos de raciocínio que respondam sem uma fase de raciocínio (chat_template_kwargs enable_thinking=false; vLLM/SGLang, por exemplo, Qwen3). Afeta somente o provedor “Personalizado” (compatível com OpenAI). Evita resumos vazios quando o modelo gasta toda a saída no raciocínio, e economiza tempo e tokens."
  text_helpdesk_ai_thinking_kb_warning: "As sugestões da base de conhecimento entram no resumo. Sem raciocínio, o modelo avalia mal se um caso anterior realmente se aplica: em um teste com 20 tickets, ele acrescentou 9 vezes uma sugestão de solução inadequada ou vazia (0 vezes com raciocínio). Mantenha o raciocínio permitido enquanto as sugestões da base de conhecimento forem exibidas no resumo."
  text_helpdesk_ai_summary_fallback: "Criado sem o modo de raciocínio porque a primeira resposta veio vazia. As sugestões da base de conhecimento não foram verificadas para este resumo."
  label_helpdesk_ai_thinking_central: "Configuração central (%{value})"
  label_helpdesk_ai_thinking_off: "Raciocínio desativado"
  label_helpdesk_ai_thinking_on: "Raciocínio permitido"
  field_helpdesk_ai_timeout: "Tempo limite (segundos)"
  text_helpdesk_ai_privacy_info: "Proteção de dados: o conteúdo dos e-mails recebidos e os anexos selecionados são enviados ao provedor configurado. Use o provedor “Personalizado” com um endpoint auto-hospedado para um fluxo totalmente local (on-premise)."
