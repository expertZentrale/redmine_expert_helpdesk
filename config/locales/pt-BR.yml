  # Knowledge base (RAG)
  label_helpdesk_kb_settings: "Base de conhecimento (RAG)"
  field_helpdesk_kb_enabled: "Ativar base de conhecimento"
  text_helpdesk_kb_enabled_info: "Chave geral. Em cada projeto, você escolhe se ele contribui com tickets resolvidos e onde as soluções sugeridas aparecem."
  field_helpdesk_kb_backend: "Armazenamento vetorial"
  text_helpdesk_kb_backend_info: "Qdrant (REST, sem gem adicional) ou Postgres + pgvector (requer a gem pg na implantação). Um namespace por projeto — isolamento estrito."
  field_helpdesk_kb_qdrant_url: "URL do Qdrant"
  text_helpdesk_kb_qdrant_url_info: "por exemplo, http://qdrant:6333 (usado quando o armazenamento vetorial é o Qdrant)."
  field_helpdesk_kb_qdrant_api_key: "Chave de API do Qdrant"
  field_helpdesk_kb_pg_url: "URL de conexão do pgvector"
  text_helpdesk_kb_pg_url_info: "por exemplo, postgres://user:pass@host:5432/db (usado quando o armazenamento vetorial é o pgvector; requer a gem pg)."
  field_helpdesk_kb_embed_provider: "Provedor de embeddings"
  field_helpdesk_kb_embed_model: "Modelo de embeddings"
  field_helpdesk_kb_embed_endpoint: "Endpoint de embeddings"
  text_helpdesk_kb_embed_endpoint_info: "Em branco = padrão do provedor. Obrigatório para um endpoint auto-hospedado compatível com OpenAI (Ollama/vLLM/LocalAI)."
  field_helpdesk_kb_embed_api_key: "Chave de API de embeddings"
  text_helpdesk_kb_embed_api_key_info: "Em branco reutiliza a chave de API do resumo quando o mesmo provedor é usado. (A Anthropic não tem API de embeddings — use a OpenAI ou um endpoint auto-hospedado.)"
  field_helpdesk_kb_extract_prompt: "Prompt de extração"
  text_helpdesk_kb_extract_prompt_info: "Deixe vazio para usar o prompt embutido do nível de detalhe selecionado (exibido em cinza). Um texto próprio o substitui em todos os níveis e precisa fazer o modelo retornar JSON."
  field_helpdesk_kb_extract_detail: "Nível de detalhe"
  label_helpdesk_kb_extract_detail_general: "Geral"
  label_helpdesk_kb_extract_detail_specific: "Específico"
  label_helpdesk_kb_extract_detail_most_specific: "Muito específico"
  label_helpdesk_kb_extract_detail_central: "Configuração central (%{level})"
  text_helpdesk_kb_extract_detail_info: "Quanto detalhe concreto as entradas da base de conhecimento mantêm. Geral: problema e solução generalizados. Específico: mantém nomes de aplicativos, versões, códigos e mensagens de erro. Muito específico: também mantém caminhos, nomes de servidores e compartilhamentos, valores de configuração e a ordem exata dos passos. Em todos os níveis, o modelo é instruído a omitir senhas e dados pessoais. Vale para entradas extraídas daqui em diante; as existentes podem ser extraídas novamente na aba Base de conhecimento."
  text_helpdesk_kb_extract_prompt_project_info: "Prompt de extração do projeto, combinado com o prompt central do nível de detalhe efetivo de acordo com o modo do prompt. Com “Substituir pelo prompt do projeto”, ele precisa fazer o modelo retornar JSON."
  field_helpdesk_kb_top_k: "Top-K"
  field_helpdesk_kb_min_score: "Pontuação mín."
  field_helpdesk_kb_min_results: "Mín. de resultados"
  text_helpdesk_kb_retrieval_info: "Recuperação: busca até Top-K correspondências e mantém as que atingem a Pontuação mín.; só sugere quando restam pelo menos Mín. de resultados."
  field_helpdesk_kb_rerank_enabled: "Usar reranker"
  text_helpdesk_kb_rerank_enabled_info: "Segunda etapa de recuperação: um cross-encoder pontua novamente a pré-seleção do armazenamento vetorial. Bem mais preciso do que a similaridade sozinha, ao custo de uma requisição extra por pesquisa. Desativado por padrão."
  field_helpdesk_kb_rerank_model: "Modelo do reranker"
  field_helpdesk_kb_rerank_endpoint: "Endpoint do reranker"
  text_helpdesk_kb_rerank_endpoint_info: "URL base sem /rerank. Deixe vazio para usar o endpoint de embeddings – na maioria dos provedores, os dois modelos ficam na mesma URL base."
  field_helpdesk_kb_rerank_api_key: "Chave de API do reranker"
  text_helpdesk_kb_rerank_api_key_info: "Deixe vazio para usar a chave de API de embeddings."
  field_helpdesk_kb_rerank_candidates: "Candidatos"
  field_helpdesk_kb_rerank_min_score: "Pontuação mín. (rerank)"
  field_helpdesk_kb_rerank_timeout: "Tempo limite (s)"
  text_helpdesk_kb_rerank_scoring_info: "Os candidatos são buscados no armazenamento vetorial e pontuados novamente, e os melhores Top-K acima da pontuação mínima são mantidos. Enquanto o reranking estiver ativo, este mínimo substitui o de similaridade acima – os dois usam escalas diferentes e precisam de ajuste separado. Se o reranker falhar, a pesquisa volta silenciosamente à classificação por similaridade e à respectiva pontuação mínima."
  text_helpdesk_kb_privacy_info: "Proteção de dados: o texto de problema/solução é enviado ao provedor de embeddings e armazenado no banco vetorial. Com o reranker ativo, cada pesquisa também envia o texto do ticket atual junto com os textos de problema das entradas candidatas – ou seja, conteúdo de outros tickets do mesmo projeto – ao provedor do reranker em uma única requisição; nada é armazenado lá. Use endpoints auto-hospedados de embeddings e de reranker para um fluxo totalmente local (on-premise). O conhecimento é estritamente por projeto."
  field_helpdesk_kb_ingest_mode: "Contribuir para a base de conhecimento"
  text_helpdesk_kb_ingest_mode_info: "Se os tickets resolvidos deste projeto se tornam entradas da base de conhecimento."
