  field_helpdesk_kb_extract_prompt: "Prompt d'extraction"
  text_helpdesk_kb_extract_prompt_info: "Laissez vide pour utiliser le prompt intégré du niveau de détail sélectionné (affiché en grisé). Votre propre texte le remplace pour tous les niveaux et doit amener le modèle à renvoyer du JSON."
  field_helpdesk_kb_extract_detail: "Niveau de détail"
  label_helpdesk_kb_extract_detail_general: "Général"
  label_helpdesk_kb_extract_detail_specific: "Spécifique"
  label_helpdesk_kb_extract_detail_most_specific: "Très spécifique"
  label_helpdesk_kb_extract_detail_central: "Paramètre central (%{level})"
  text_helpdesk_kb_extract_detail_info: "Quantité de détails concrets conservés dans les entrées de la base de connaissances. Général : problème et solution généralisés. Spécifique : conserve les noms d'applications, les versions, les codes et messages d'erreur. Très spécifique : conserve en plus les chemins, les noms de serveurs et de partages, les valeurs de configuration et l'ordre exact des étapes. À chaque niveau, le modèle reçoit l'instruction d'omettre les mots de passe et les données personnelles. S'applique aux entrées nouvellement extraites ; les entrées existantes peuvent être réextraites dans l'onglet Base de connaissances."
  text_helpdesk_kb_extract_prompt_project_info: "Prompt d'extraction du projet, combiné selon le mode du prompt avec le prompt central du niveau de détail effectif. Avec « Remplacer par le prompt du projet », il doit amener le modèle à renvoyer du JSON."
