  label_helpdesk_autoresponder: "Réponse automatique"
  field_helpdesk_autoresponder_enabled: "Réponse automatique activée"
  field_helpdesk_autoresponder_subject: "Sujet"
  field_helpdesk_autoresponder_body: "Texte"
  text_helpdesk_macros_info: "Macros disponibles : {{issue.id}}, {{issue.subject}}, {{issue.url}}, {{issue.status}}, {{issue.priority}}, {{issue.tracker}}, {{issue.author}}, {{issue.assignee}}, {{issue.category}}, {{issue.version}}, {{issue.start_date}}, {{issue.due_date}}, {{issue.created_on}}, {{issue.updated_on}}, {{issue.done_ratio}}, {{issue.description}}, {{issue.parent_id}}, {{contact.name}}, {{contact.email}}, {{user.name}}, {{user.firstname}}, {{user.lastname}}, {{user.login}}, {{user.mail}}, {{project.name}}, {{project.identifier}}. Les champs personnalisés de demande activés sont disponibles sous la forme {{issue.cf.<name>}} ou {{issue.cf.<id>}}. L'ancienne notation ({{ticket_id}}, {{contact_name}}, ...) fonctionne toujours."
  field_helpdesk_smtp_from_address: "Expéditeur personnalisé (From)"
  text_helpdesk_smtp_from_address_info: "Facultatif. Vide = envoi sous l'adresse de la boîte aux lettres. Utilisé uniquement lorsque les réponses passent par la configuration SMTP propre à Redmine ; Graph et le serveur SMTP de la boîte aux lettres s'authentifient en tant que boîte aux lettres et refusent un expéditeur étranger. Le relais doit être autorisé à envoyer pour cette adresse (SPF/DMARC)."
  field_helpdesk_smtp_reply_to_mailbox: "Définir Reply-To sur l'adresse de la boîte aux lettres"
  text_helpdesk_smtp_reply_to_mailbox_info: "Désactivé par défaut. Laissez-le désactivé lorsque l'adresse d'expéditeur distribue de toute façon dans cette boîte aux lettres – par exemple une liste de distribution dont cette boîte aux lettres est l'unique membre ; un Reply-To ne ferait alors qu'exposer l'adresse interne. Activez-le lorsque les e-mails envoyés à l'adresse d'expéditeur n'arrivent pas dans cette boîte aux lettres, sinon les réponses des clients ne reviennent jamais dans le ticket."
  error_helpdesk_invalid_from_address: "n'est pas une adresse e-mail valide"
