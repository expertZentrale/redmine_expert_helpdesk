  field_helpdesk_ai_model: "Modèle"
  text_helpdesk_ai_model_info: "ID du modèle. Pour les résumés, un modèle rapide et peu coûteux suffit – p. ex. OpenAI gpt-4o-mini ou gpt-5-nano, Anthropic claude-haiku-4-5, ou un modèle auto-hébergé comme llama3.1. Les modèles OpenAI GPT-5 / série o sont pris en charge. Les pièces jointes image (vision) nécessitent un modèle compatible vision (p. ex. gpt-4o-mini, gpt-5-nano, claude-haiku-4-5). Pour les modèles de raisonnement (GPT-5/série o), gardez une valeur « Jetons de sortie max. » suffisamment élevée."
