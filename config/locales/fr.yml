  field_helpdesk_kb_min_score: "Score min."
  field_helpdesk_kb_min_results: "Résultats min."
  text_helpdesk_kb_retrieval_info: "Recherche : récupérer jusqu'à Top-K correspondances, conserver celles dont le score atteint au moins Score min. ; ne proposer que s'il en reste au moins Résultats min."
  field_helpdesk_kb_rerank_enabled: "Utiliser le reranker"
  text_helpdesk_kb_rerank_enabled_info: "Second niveau de recherche : un cross-encoder réévalue la présélection issue de la base vectorielle. Nettement plus précis que la seule similarité, au prix d'une requête supplémentaire par recherche. Désactivé par défaut."
  field_helpdesk_kb_rerank_model: "Modèle de reranker"
  field_helpdesk_kb_rerank_endpoint: "Point de terminaison du reranker"
  text_helpdesk_kb_rerank_endpoint_info: "URL de base sans /rerank. Laissez vide pour utiliser le point de terminaison des embeddings – chez la plupart des fournisseurs, les deux modèles partagent la même URL de base."
  field_helpdesk_kb_rerank_api_key: "Clé API du reranker"
  text_helpdesk_kb_rerank_api_key_info: "Laissez vide pour utiliser la clé API des embeddings."
  field_helpdesk_kb_rerank_candidates: "Candidats"
  field_helpdesk_kb_rerank_min_score: "Score min. (rerank)"
  field_helpdesk_kb_rerank_timeout: "Délai (s)"
  text_helpdesk_kb_rerank_scoring_info: "Les candidats sont récupérés dans la base vectorielle, réévalués, et les Top-K meilleurs au-dessus du score minimal sont conservés. Tant que le reranking est actif, ce minimum remplace celui de la similarité ci-dessus – les deux utilisent des échelles différentes et se règlent séparément. Si le reranker échoue, la recherche revient silencieusement au classement par similarité et à son score minimal."
  text_helpdesk_kb_privacy_info: "Protection des données : le texte problème/solution est envoyé au fournisseur d'embeddings et stocké dans la base de données vectorielle. Lorsque le reranker est actif, chaque recherche envoie en outre au fournisseur du reranker, en une seule requête, le texte du ticket actuel ainsi que les textes de problème des entrées candidates – c'est-à-dire du contenu d'autres tickets du même projet ; rien n'y est stocké. Utilisez des points de terminaison auto-hébergés pour les embeddings et le reranker pour un traitement entièrement sur site. Les connaissances sont strictement cloisonnées par projet."
  field_helpdesk_kb_ingest_mode: "Alimenter la base de connaissances"
  text_helpdesk_kb_ingest_mode_info: "Indique si les tickets résolus de ce projet deviennent des entrées de la base de connaissances."
