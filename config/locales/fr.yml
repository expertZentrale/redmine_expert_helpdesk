  text_helpdesk_kb_saved_not_indexed: "Enregistrée, mais le vecteur n'a pas pu être mis à jour (base vectorielle ou embeddings injoignables/non configurés). Utilisez « Reconstruire l'index » dès qu'ils sont disponibles."
