  text_helpdesk_info_request_note_visibility_info: "La note consigne qu'une relance a été envoyée et ce qui a été demandé. Publique, elle maintient agent et client au même niveau d'information ; interne, elle nécessite la permission « Voir les notes privées »."
  text_helpdesk_info_request_enabled_info: "Interrupteur principal. Lorsqu'il est désactivé, aucun projet n'effectue le contrôle, quelle que soit sa configuration."
  text_helpdesk_info_request_mode_info: "Contrôle uniquement le PREMIER e-mail d'un nouveau ticket. Le mode basé sur des règles fonctionne sans IA ; le mode assisté par IA nécessite la configuration IA ci-dessus."
  text_helpdesk_info_request_globally_off: "Le contrôle de complétude est désactivé de manière centrale (Administration → Plugins) ; ces paramètres n'ont donc pas encore d'effet."
  text_helpdesk_info_request_ai_unavailable: "L'IA est désactivée de manière centrale ; le mode « Assisté par IA » ne peut donc pas fonctionner. Utilisez le mode basé sur des règles ou activez d'abord l'IA."
  text_helpdesk_info_request_min_chars_info: "Les e-mails plus courts sont considérés comme incomplets. L'historique cité et les signatures sont retirés avant la mesure. 0 désactive cette règle."
  text_helpdesk_info_request_min_words_info: "Comme ci-dessus, compté en mots. 0 désactive cette règle."
  text_helpdesk_info_request_require_attachment_info: "Considérer comme incomplet un e-mail sans aucune pièce jointe (capture d'écran, journal, photo)."
  field_helpdesk_info_request_min_attachment_kb: "Taille minimale des images"
  text_helpdesk_info_request_min_attachment_kb_info: "En KB. Les images plus petites ne comptent pas comme capture d'écran ou photo – logos de signature et pixels de suivi accompagnent presque chaque e-mail. Ne s'applique qu'aux images ; un petit journal ou un PDF compte toujours. 0 désactive le seuil."
  field_helpdesk_info_request_sender_blacklist: "Ne jamais relancer ces expéditeurs"
  field_helpdesk_contact_info_request_opt_out: "Ne jamais demander d'informations complémentaires"
  label_helpdesk_contact_info_request_opt_out_short: "pas de relance"
  button_helpdesk_contact_info_request_stop: "ne jamais relancer"
  button_helpdesk_contact_info_request_resume: "réactiver les relances"
  text_helpdesk_contact_info_request_resume_info: "Autoriser de nouveau le contrôle de complétude à demander à ce client les informations manquantes."
  text_helpdesk_contact_info_request_opt_out_info: "Derrière cette adresse, personne ne répond aux relances : rapports de sauvegarde, alertes de supervision, e-mails cron. Les tickets sont toujours créés et toujours contrôlés, mais le client ne reçoit jamais d'e-mail à ce sujet. La même décision pour une adresse ou un domaine entier se prend dans le paramètre de projet « Ne jamais relancer ces expéditeurs »."
  text_helpdesk_info_request_sender_blacklist_info: "Une entrée par ligne : adresse complète, domaine seul ou « @domaine ». Les rapports de sauvegarde, e-mails cron et alertes de supervision sont de vrais tickets, mais personne derrière eux ne peut répondre à une relance. Les e-mails qui se déclarent eux-mêmes générés automatiquement dans leurs en-têtes sont ignorés automatiquement, même sans entrée ici : Auto-Submitted, Precedence (bulk, list, junk), X-Auto-Response-Suppress, X-MS-Exchange-Generated-Message-Source et les en-têtes X-Autoreply/X-Autorespond/X-Autoresponder. Les avis de non-remise (NDR) ne sont pas ignorés."
  text_helpdesk_info_request_keywords_info: "Un terme par ligne. L'e-mail doit contenir au moins l'un d'eux, sinon il est considéré comme incomplet. Vide = règle désactivée."
  text_helpdesk_info_request_threshold_info: "Nombre de règles qui doivent échouer avant que le client ne soit relancé. 1 = la première règle non respectée déclenche déjà une relance."
  text_helpdesk_info_request_ai_prompt_info: "Le modèle doit répondre en JSON ({\"complete\": true|false, \"missing\": [...]}). Toute réponse illisible est considérée comme complète ; aucun e-mail n'est alors envoyé."
  text_helpdesk_info_request_subject_info: "Les macros sont autorisées. Vide = texte central par défaut."
  text_helpdesk_info_request_body_info: "Les macros sont autorisées. {{missing_info}} insère la liste des informations manquantes. Vide = texte central par défaut."
  text_helpdesk_info_request_status_info: "Facultatif, p. ex. « En attente du client ». Vide = le statut reste inchangé. Les statuts fermés ne sont pas proposés : fermer un ticket compte à la fois comme réaction et comme résolution pour le SLA, et une relance automatique ne doit pas avoir cet effet."
  text_helpdesk_info_request_reason_too_short: "Une brève description du problème (qu'est-ce qui ne fonctionne pas exactement ?)"
  text_helpdesk_info_request_reason_too_few_words: "Quelques précisions supplémentaires sur votre demande"
  text_helpdesk_info_request_reason_no_attachment: "Une capture d'écran ou le message d'erreur sous forme de fichier, si possible"
  text_helpdesk_info_request_reason_no_keyword: "Le système, l'application ou l'appareil concerné"
  note_helpdesk_info_request_sent: "Relance automatique envoyée à %{email} : l'e-mail initial ne contenait pas assez d'informations."
