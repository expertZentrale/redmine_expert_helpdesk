  text_helpdesk_kb_tab_info: "Coppie problema/soluzione estratte dai ticket risolti. Solo le voci approvate vengono usate per le proposte e le bozze di risposta. Salvando una voce se ne ricalcola il vettore: non modificare mai le voci direttamente nel database vettoriale."
  text_helpdesk_kb_problem_info: "Per la ricerca per similarità viene usato solo il testo del problema; scrivilo come lo descriverebbe un cliente."
  text_helpdesk_kb_status_info: "Le voci approvate sono subito ricercabili; quelle in attesa vengono conservate ma non usate."
  text_helpdesk_kb_issue_id_info: "Ticket di questo progetto su cui si basa la voce (una voce per ticket)."
  text_helpdesk_kb_reindex_info: "Svuota l'archivio vettoriale di questo progetto e ricalcola gli embedding di tutte le voci approvate (ad es. dopo aver cambiato il modello di embedding)."
  text_helpdesk_kb_reindex_confirm: "Ricostruire l'indice vettoriale di questo progetto? Le proposte potrebbero essere incomplete finché la ricostruzione non è terminata."
  text_helpdesk_kb_reject_confirm: "Rifiutare questa voce? Viene rimossa dalla ricerca e non verrà ricreata automaticamente quando il ticket verrà chiuso di nuovo."
  text_helpdesk_kb_delete_confirm: "Eliminare definitivamente questa voce? Il ticket potrebbe essere acquisito di nuovo alla prossima chiusura."
  text_helpdesk_kb_saved_not_indexed: "Salvata, ma non è stato possibile aggiornare il vettore (archivio o embedding non raggiungibili/configurati). Usa «Ricostruisci indice» quando sarà disponibile."
  text_helpdesk_kb_problem_blank: "Salvata, ma non ricercabile: il testo del problema è vuoto."
  text_helpdesk_kb_unindex_failed: "Non è stato possibile rimuovere il vettore dall'archivio (non raggiungibile). La voce è stata mantenuta; riprova, oppure usa «Ricostruisci indice» quando l'archivio sarà disponibile."
  notice_helpdesk_kb_saved_indexed: "Salvata e con embedding ricalcolato."
  notice_helpdesk_kb_reindex_queued: "Ricostruzione dell'indice avviata. Viene eseguita in background."
  button_helpdesk_kb_reextract: "Estrai di nuovo le voci"
  text_helpdesk_kb_reextract_info: "Esegue di nuovo l'estrazione IA delle voci con il livello di dettaglio attuale. Le voci modificate, approvate o rifiutate da una persona restano invariate."
  text_helpdesk_kb_reextract_confirm: "%{count} voci sono state estratte con un altro livello di dettaglio. Estrarle di nuovo con «%{level}»? Costa una chiamata IA per voce."
  text_helpdesk_kb_reextract_confirm_all: "Estrarre di nuovo tutte le %{count} voci (non modificate da una persona) con «%{level}», ad es. dopo una modifica del prompt? Costa una chiamata IA per voce."
  notice_helpdesk_kb_reextract_queued: "Nuova estrazione di %{count} voci avviata. Viene eseguita in background; le voci mantengono il loro stato."
  notice_helpdesk_kb_reextract_nothing: "Nessuna voce da estrarre di nuovo."

