  # Knowledge base (RAG)
  label_helpdesk_kb_settings: "Base di conoscenza (RAG)"
  field_helpdesk_kb_enabled: "Abilita base di conoscenza"
  text_helpdesk_kb_enabled_info: "Interruttore generale. Per ogni progetto scegli se contribuisce con i ticket risolti e dove compaiono le soluzioni proposte."
  field_helpdesk_kb_backend: "Archivio vettoriale"
  text_helpdesk_kb_backend_info: "Qdrant (REST, nessuna gem aggiuntiva) o Postgres + pgvector (richiede la gem pg nel deployment). Uno spazio dei nomi per progetto: isolamento rigoroso."
  field_helpdesk_kb_qdrant_url: "URL Qdrant"
  text_helpdesk_kb_qdrant_url_info: "ad es. http://qdrant:6333 (usato quando l'archivio vettoriale è Qdrant)."
  field_helpdesk_kb_qdrant_api_key: "Chiave API Qdrant"
  field_helpdesk_kb_pg_url: "URL di connessione pgvector"
  text_helpdesk_kb_pg_url_info: "ad es. postgres://user:pass@host:5432/db (usato quando l'archivio vettoriale è pgvector; richiede la gem pg)."
  field_helpdesk_kb_embed_provider: "Provider di embedding"
  field_helpdesk_kb_embed_model: "Modello di embedding"
  field_helpdesk_kb_embed_endpoint: "Endpoint di embedding"
  text_helpdesk_kb_embed_endpoint_info: "Vuoto = predefinito del provider. Obbligatorio per un endpoint self-hosted compatibile OpenAI (Ollama/vLLM/LocalAI)."
  field_helpdesk_kb_embed_api_key: "Chiave API di embedding"
  text_helpdesk_kb_embed_api_key_info: "Se vuoto, viene riutilizzata la chiave API dei riepiloghi quando si usa lo stesso provider. (Anthropic non ha un'API di embedding: usa OpenAI o un endpoint self-hosted.)"
  field_helpdesk_kb_extract_prompt: "Prompt di estrazione"
  text_helpdesk_kb_extract_prompt_info: "Lascia vuoto per usare il prompt integrato del livello di dettaglio selezionato (mostrato in grigio). Un testo tuo lo sostituisce per tutti i livelli e deve far restituire JSON al modello."
  field_helpdesk_kb_extract_detail: "Livello di dettaglio"
  label_helpdesk_kb_extract_detail_general: "Generale"
  label_helpdesk_kb_extract_detail_specific: "Specifico"
  label_helpdesk_kb_extract_detail_most_specific: "Molto specifico"
  label_helpdesk_kb_extract_detail_central: "Impostazione centrale (%{level})"
  text_helpdesk_kb_extract_detail_info: "Quanti dettagli concreti conservano le voci della base di conoscenza. Generale: problema e soluzione generalizzati. Specifico: conserva nomi di applicazioni, versioni, codici e messaggi di errore. Molto specifico: conserva anche percorsi, nomi di server e di condivisioni, valori di configurazione e l'ordine esatto dei passaggi. A ogni livello il modello ha l'istruzione di omettere password e dati personali. Vale per le voci estratte da ora in poi; quelle esistenti possono essere estratte di nuovo nella scheda Base di conoscenza."
  text_helpdesk_kb_extract_prompt_project_info: "Prompt di estrazione del progetto, combinato con il prompt centrale del livello di dettaglio effettivo secondo la modalità prompt. Con «Sostituisci con il prompt del progetto» deve far restituire JSON al modello."
  field_helpdesk_kb_top_k: "Top-K"
  field_helpdesk_kb_min_score: "Punteggio min."
  field_helpdesk_kb_min_results: "Risultati min."
  text_helpdesk_kb_retrieval_info: "Recupero: cerca fino a Top-K corrispondenze, mantiene quelle con punteggio pari o superiore a Punteggio min. e propone solo se ne restano almeno Risultati min."
  field_helpdesk_kb_rerank_enabled: "Usa reranker"
  text_helpdesk_kb_rerank_enabled_info: "Seconda fase di recupero: un cross-encoder rivaluta la rosa di candidati dell'archivio vettoriale. Nettamente più preciso della sola similarità, al costo di una richiesta in più per ogni ricerca. Disattivato per impostazione predefinita."
  field_helpdesk_kb_rerank_model: "Modello reranker"
  field_helpdesk_kb_rerank_endpoint: "Endpoint reranker"
  text_helpdesk_kb_rerank_endpoint_info: "URL di base senza /rerank. Lascia vuoto per usare l'endpoint di embedding: con la maggior parte dei provider entrambi i modelli si trovano sullo stesso URL di base."
  field_helpdesk_kb_rerank_api_key: "Chiave API reranker"
  text_helpdesk_kb_rerank_api_key_info: "Lascia vuoto per usare la chiave API di embedding."
  field_helpdesk_kb_rerank_candidates: "Candidati"
  field_helpdesk_kb_rerank_min_score: "Punteggio min. (rerank)"
  field_helpdesk_kb_rerank_timeout: "Timeout (s)"
  text_helpdesk_kb_rerank_scoring_info: "I candidati vengono recuperati dall'archivio vettoriale e rivalutati, e vengono mantenuti i migliori Top-K sopra il punteggio minimo. Finché il reranking è attivo, questo minimo sostituisce quello di similarità indicato sopra: le due scale sono diverse e vanno regolate separatamente. Se il reranker non risponde, la ricerca torna silenziosamente all'ordinamento per similarità e al relativo punteggio minimo."
  text_helpdesk_kb_privacy_info: "Protezione dei dati: il testo di problema/soluzione viene inviato al provider di embedding e salvato nel database vettoriale. Con il reranker attivo, ogni ricerca invia inoltre al provider del reranker, in un'unica richiesta, il testo del ticket corrente insieme ai testi dei problemi delle voci candidate, cioè contenuti di altri ticket dello stesso progetto; lì non viene salvato nulla. Usa endpoint self-hosted per embedding e reranker per un flusso interamente on-premise. La conoscenza è rigorosamente separata per progetto."
  field_helpdesk_kb_ingest_mode: "Contribuisci alla base di conoscenza"
  text_helpdesk_kb_ingest_mode_info: "Se i ticket risolti di questo progetto diventano voci della base di conoscenza."
