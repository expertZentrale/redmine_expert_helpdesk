  field_helpdesk_info_request_status: "Stato dopo la richiesta"
  field_helpdesk_info_request_note_visibility: "Nota sulla richiesta di informazioni"
  label_helpdesk_info_request_note_public: "Pubblica (visibile anche al cliente)"
  label_helpdesk_info_request_note_private: "Interna (solo operatori)"
  text_helpdesk_info_request_note_visibility_info: "La nota registra che è stata inviata una richiesta di informazioni e che cosa è stato chiesto. Pubblica tiene operatore e cliente allineati sulle stesse informazioni; interna richiede il permesso «Visualizza note private»."
  text_helpdesk_info_request_enabled_info: "Interruttore generale. Se disattivato, nessun progetto esegue il controllo, indipendentemente da come è configurato."
  text_helpdesk_info_request_mode_info: "Controlla solo la PRIMA email di un nuovo ticket. Basato su regole funziona senza IA; Basato su IA richiede le impostazioni IA qui sopra."
  text_helpdesk_info_request_globally_off: "Il controllo di completezza è disattivato a livello centrale (Amministrazione → Plugin), quindi queste impostazioni non hanno ancora effetto."
  text_helpdesk_info_request_ai_unavailable: "L'IA è disattivata a livello centrale, quindi «Basato su IA» non può funzionare. Usa la modalità basata su regole o abilita prima l'IA."
  text_helpdesk_info_request_min_chars_info: "Le email più corte di questo valore sono considerate incomplete. Cronologia citata e firme vengono rimosse prima della misurazione. 0 disattiva questa regola."
  text_helpdesk_info_request_min_words_info: "Come sopra, contato in parole. 0 disattiva questa regola."
  text_helpdesk_info_request_require_attachment_info: "Considera incompleta un'email senza alcun allegato (screenshot, log, foto)."
  field_helpdesk_info_request_min_attachment_kb: "Dimensione minima delle immagini"
  text_helpdesk_info_request_min_attachment_kb_info: "In KB. Le immagini più piccole non contano come screenshot o foto: loghi delle firme e pixel di tracciamento sono presenti in quasi ogni email. Vale solo per le immagini; un piccolo log o PDF conta comunque. 0 disattiva la soglia."
  field_helpdesk_info_request_sender_blacklist: "Non chiedere mai a questi mittenti"
  field_helpdesk_contact_info_request_opt_out: "Non chiedere mai altre informazioni"
  label_helpdesk_contact_info_request_opt_out_short: "nessuna richiesta"
  button_helpdesk_contact_info_request_stop: "non chiedere mai"
  button_helpdesk_contact_info_request_resume: "chiedi di nuovo"
  text_helpdesk_contact_info_request_resume_info: "Consenti al controllo di completezza di chiedere di nuovo a questo cliente le informazioni mancanti."
  text_helpdesk_contact_info_request_opt_out_info: "Dietro questo indirizzo nessuno risponde a una richiesta di informazioni: report di backup, avvisi di monitoraggio, email di cron. I loro ticket vengono comunque creati e verificati per completezza, ma al cliente non viene mai inviata alcuna email in merito. La stessa scelta per un intero indirizzo o dominio va fatta nell'impostazione di progetto «Non chiedere mai a questi mittenti»."
  text_helpdesk_info_request_sender_blacklist_info: "Una voce per riga: indirizzo completo, solo dominio o «@dominio». Report di backup, email di cron e avvisi di monitoraggio sono ticket veri, ma dietro di essi nessuno può rispondere a una richiesta di informazioni. Le email che nelle intestazioni si dichiarano generate automaticamente vengono saltate anche senza una voce qui: Auto-Submitted, Precedence (bulk, list, junk), X-Auto-Response-Suppress, X-MS-Exchange-Generated-Message-Source e le intestazioni X-Autoreply/X-Autorespond/X-Autoresponder. Gli avvisi di mancato recapito (NDR) non vengono saltati."
  text_helpdesk_info_request_keywords_info: "Un termine per riga. L'email deve contenerne almeno uno, altrimenti è considerata incompleta. Vuoto disattiva questa regola."
  text_helpdesk_info_request_threshold_info: "Quante regole devono fallire prima che venga interpellato il cliente. 1 = già la prima regola non soddisfatta fa partire una richiesta di informazioni."
  text_helpdesk_info_request_ai_prompt_info: "Il modello deve rispondere in JSON ({\"complete\": true|false, \"missing\": [...]}). Qualsiasi risposta illeggibile conta come completa, quindi non parte alcuna email."
  text_helpdesk_info_request_subject_info: "Le macro sono consentite. Vuoto = si usa il testo predefinito centrale."
  text_helpdesk_info_request_body_info: "Le macro sono consentite. {{missing_info}} inserisce l'elenco dei dettagli mancanti. Vuoto = si usa il testo predefinito centrale."
  text_helpdesk_info_request_status_info: "Facoltativo, ad es. «In attesa del cliente». Vuoto lascia invariato lo stato. Gli stati di chiusura non vengono proposti: per lo SLA chiudere un ticket vale sia come reazione sia come risoluzione, e una richiesta automatica non deve farlo."
  text_helpdesk_info_request_reason_too_short: "Una breve descrizione del problema (che cosa esattamente non funziona?)"
  text_helpdesk_info_request_reason_too_few_words: "Qualche dettaglio in più sulla tua richiesta"
  text_helpdesk_info_request_reason_no_attachment: "Uno screenshot o il messaggio di errore come file, se disponibile"
  text_helpdesk_info_request_reason_no_keyword: "Il sistema, l'applicazione o il dispositivo interessato"
  note_helpdesk_info_request_sent: "Richiesta automatica di informazioni inviata a %{email}: l'email iniziale non conteneva informazioni sufficienti."
  label_helpdesk_ai_stats_type_completeness: "Controllo di completezza"

