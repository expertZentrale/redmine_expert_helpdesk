  label_helpdesk_ai_prompt_mode_inherit: "Usa il prompt centrale"
  label_helpdesk_ai_prompt_mode_extend: "Estendi il prompt centrale"
  label_helpdesk_ai_prompt_mode_override: "Sostituisci con il prompt del progetto"
  text_helpdesk_ai_prompt_mode_info: "Come il prompt del progetto qui sotto si combina con il prompt predefinito centrale."
  field_helpdesk_ai_attachments: "Invia allegati all'IA"
  label_helpdesk_ai_attach_metadata: "Nomi file / metadati"
  label_helpdesk_ai_attach_text: "Testo estratto (PDF, file di testo)"
  label_helpdesk_ai_attach_images: "Immagini (serve un modello vision)"
  text_helpdesk_ai_attachments_info: "Scegli quali informazioni sugli allegati includere nei dati per il riepilogo. Le immagini richiedono un modello con capacità vision."
  field_helpdesk_ai_min_image_kb: "Dimensione minima delle immagini"
  text_helpdesk_ai_min_image_kb_info: "In KB. Le immagini più piccole non vengono inviate al modello: loghi delle firme, icone social e pixel di tracciamento sono presenti in quasi ogni email, consumano token inutilmente e spingono lo screenshot vero e proprio fuori dal budget di immagini. Vengono saltate anche le immagini sotto i 64x64 pixel. Vale solo per le immagini; testo e metadati degli allegati non sono interessati. 0 disattiva la soglia."
  field_helpdesk_ai_include_journal: "Includi l'intera cronologia del ticket"
  text_helpdesk_ai_include_journal_info: "Invia l'intera conversazione (descrizione + tutte le note) invece della sola email che ha avviato il riepilogo. Le note di riepilogo IA del plugin stesso sono escluse."
  field_helpdesk_ai_include_private_notes: "Includi anche le note private"
  text_helpdesk_ai_include_private_notes_info: "Vale solo quando è inclusa l'intera cronologia. Attenzione: in tal caso anche le note private (interne) vengono inviate al provider IA."
