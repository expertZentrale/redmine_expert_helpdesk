  field_helpdesk_ai_api_key: "Chiave API"
  field_helpdesk_ai_endpoint: "Endpoint (URL di base)"
  text_helpdesk_ai_endpoint_info: "Lascia vuoto per usare il valore predefinito del provider. Obbligatorio per «Personalizzato» (URL self-hosted compatibile OpenAI, ad es. Ollama/vLLM/LocalAI/LM Studio)."
  field_helpdesk_ai_model: "Modello"
  text_helpdesk_ai_model_info: "ID del modello. Per i riepiloghi basta un modello veloce ed economico, ad es. OpenAI gpt-4o-mini o gpt-5-nano, Anthropic claude-haiku-4-5, oppure un modello self-hosted come llama3.1. I modelli OpenAI GPT-5 / serie o sono supportati. Gli allegati immagine (vision) richiedono un modello con capacità vision (ad es. gpt-4o-mini, gpt-5-nano, claude-haiku-4-5). Con i modelli di ragionamento (GPT-5/serie o) mantieni «Token in uscita max.» sufficientemente alto."
  field_helpdesk_ai_prompt: "Prompt"
  text_helpdesk_ai_prompt_info: "Istruzione predefinita globale. I progetti possono estenderla o sostituirla."
  field_helpdesk_ai_max_input_chars: "Caratteri in ingresso max."
  field_helpdesk_ai_min_input_chars: "Caratteri in ingresso min."
  text_helpdesk_ai_max_input_chars_info: "Il testo dell'email (e il testo degli allegati) viene troncato a questa lunghezza prima dell'invio."
  text_helpdesk_ai_min_input_chars_info: "Le email più corte di questo valore non vengono inviate all'IA; al loro posto il testo originale viene pubblicato come nota. 0 = riassumi sempre."
  field_helpdesk_ai_max_output_tokens: "Token in uscita max."
  field_helpdesk_ai_summary_disable_thinking: "Disattiva il ragionamento per i riepiloghi"
  text_helpdesk_ai_summary_disable_thinking_info: "Chiede ai modelli di ragionamento di rispondere senza fase di ragionamento (chat_template_kwargs enable_thinking=false; vLLM/SGLang, ad es. Qwen3). Vale solo per il provider «Personalizzato» (compatibile OpenAI). Evita riepiloghi vuoti quando il modello spende tutto l'output nel ragionamento, e fa risparmiare tempo e token."
  text_helpdesk_ai_thinking_kb_warning: "Le proposte della base di conoscenza confluiscono nel riepilogo. Senza ragionamento, il modello valuta male se un caso passato è davvero pertinente: in un test con 20 ticket ha aggiunto 9 volte una proposta di soluzione non pertinente o vuota (0 volte con il ragionamento). Lascia consentito il ragionamento finché le proposte della base di conoscenza vengono mostrate nel riepilogo."
  text_helpdesk_ai_summary_fallback: "Creato senza ragionamento perché la prima risposta era vuota. Le proposte della base di conoscenza non sono state verificate per questo riepilogo."
  label_helpdesk_ai_thinking_central: "Impostazione centrale (%{value})"
  label_helpdesk_ai_thinking_off: "Ragionamento disattivato"
  label_helpdesk_ai_thinking_on: "Ragionamento consentito"
  field_helpdesk_ai_timeout: "Timeout (secondi)"
  text_helpdesk_ai_privacy_info: "Protezione dei dati: il contenuto delle email in arrivo e gli allegati selezionati vengono inviati al provider configurato. Usa il provider «Personalizzato» con un endpoint self-hosted per un flusso interamente on-premise."
