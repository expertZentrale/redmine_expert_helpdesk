  # AI summaries
  label_helpdesk_ai_settings: "Riepiloghi IA"
  field_helpdesk_ai_enabled: "Abilita riepiloghi IA"
  text_helpdesk_ai_enabled_info: "Interruttore generale. I riepiloghi vanno inoltre abilitati per ogni progetto."
  field_helpdesk_ai_provider: "Provider"
  label_helpdesk_ai_provider_openai: "OpenAI"
  label_helpdesk_ai_provider_anthropic: "Anthropic"
