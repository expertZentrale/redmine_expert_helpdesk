  # Knowledge base (RAG)
  label_helpdesk_kb_settings: "Base de conhecimento (RAG)"
  field_helpdesk_kb_enabled: "Ativar base de conhecimento"
  text_helpdesk_kb_enabled_info: "Interruptor principal. Em cada projeto escolhe-se se contribui com tickets resolvidos e onde aparecem as soluções propostas."
  field_helpdesk_kb_backend: "Armazenamento vetorial"
  text_helpdesk_kb_backend_info: "Qdrant (REST, sem gem adicional) ou Postgres + pgvector (requer a gem pg na implementação). Um espaço de nomes por projeto — isolamento estrito."
  field_helpdesk_kb_qdrant_url: "URL do Qdrant"
  text_helpdesk_kb_qdrant_url_info: "p. ex., http://qdrant:6333 (usado quando o armazenamento vetorial é o Qdrant)."
  field_helpdesk_kb_qdrant_api_key: "Chave de API do Qdrant"
  field_helpdesk_kb_pg_url: "URL de ligação pgvector"
  text_helpdesk_kb_pg_url_info: "p. ex., postgres://user:pass@host:5432/db (usado quando o armazenamento vetorial é o pgvector; requer a gem pg)."
  field_helpdesk_kb_embed_provider: "Fornecedor de embeddings"
  field_helpdesk_kb_embed_model: "Modelo de embeddings"
  field_helpdesk_kb_embed_endpoint: "Endpoint de embeddings"
  text_helpdesk_kb_embed_endpoint_info: "Vazio = predefinição do fornecedor. Obrigatório para um endpoint próprio compatível com OpenAI (Ollama/vLLM/LocalAI)."
  field_helpdesk_kb_embed_api_key: "Chave de API de embeddings"
  text_helpdesk_kb_embed_api_key_info: "Vazio reutiliza a chave de API do resumo quando é usado o mesmo fornecedor. (A Anthropic não tem API de embeddings — use OpenAI ou um endpoint próprio.)"
  field_helpdesk_kb_extract_prompt: "Prompt de extração"
  text_helpdesk_kb_extract_prompt_info: "Deixe vazio para usar o prompt integrado do nível de detalhe selecionado (mostrado a cinzento). O seu próprio texto substitui-o em todos os níveis e tem de fazer o modelo devolver JSON."
  field_helpdesk_kb_extract_detail: "Nível de detalhe"
  label_helpdesk_kb_extract_detail_general: "Geral"
  label_helpdesk_kb_extract_detail_specific: "Específico"
  label_helpdesk_kb_extract_detail_most_specific: "Muito específico"
  label_helpdesk_kb_extract_detail_central: "Configuração central (%{level})"
  text_helpdesk_kb_extract_detail_info: "Quanto detalhe concreto mantêm as entradas da base de conhecimento. Geral: problema e solução generalizados. Específico: mantém nomes de aplicações, versões, códigos e mensagens de erro. Muito específico: mantém também caminhos, nomes de servidores e de partilhas, valores de configuração e a ordem exata dos passos. Em todos os níveis, o modelo é instruído a omitir palavras-passe e dados pessoais. Aplica-se a entradas extraídas de novo; as existentes podem ser reextraídas no separador Base de conhecimento."
  text_helpdesk_kb_extract_prompt_project_info: "Prompt de extração do projeto, combinado com o prompt central do nível de detalhe efetivo de acordo com o modo do prompt. Com «Substituir pelo prompt do projeto», tem de fazer o modelo devolver JSON."
  field_helpdesk_kb_top_k: "Top-K"
  field_helpdesk_kb_min_score: "Pontuação mín."
  field_helpdesk_kb_min_results: "Resultados mín."
  text_helpdesk_kb_retrieval_info: "Pesquisa: obter até Top-K correspondências e manter as que tenham pelo menos a Pontuação mín.; só propor quando restarem pelo menos Resultados mín."
  field_helpdesk_kb_rerank_enabled: "Usar reranker"
  text_helpdesk_kb_rerank_enabled_info: "Segunda fase de pesquisa: um cross-encoder volta a pontuar a lista prévia do armazenamento vetorial. Bastante mais preciso do que apenas a semelhança, à custa de um pedido extra por pesquisa. Desligado por omissão."
  field_helpdesk_kb_rerank_model: "Modelo de reranker"
  field_helpdesk_kb_rerank_endpoint: "Endpoint do reranker"
  text_helpdesk_kb_rerank_endpoint_info: "URL base sem /rerank. Deixe vazio para usar o endpoint de embeddings - na maioria dos fornecedores, ambos os modelos estão no mesmo URL base."
  field_helpdesk_kb_rerank_api_key: "Chave de API do reranker"
  text_helpdesk_kb_rerank_api_key_info: "Deixe vazio para usar a chave de API de embeddings."
  field_helpdesk_kb_rerank_candidates: "Candidatos"
  field_helpdesk_kb_rerank_min_score: "Pontuação mín. (rerank)"
  field_helpdesk_kb_rerank_timeout: "Tempo limite (s)"
  text_helpdesk_kb_rerank_scoring_info: "Os candidatos são obtidos do armazenamento vetorial, pontuados de novo, e são mantidos os Top-K melhores acima da pontuação mínima. Enquanto o reranking estiver ativo, este mínimo substitui o de semelhança acima - ambos usam escalas diferentes e têm de ser ajustados separadamente. Se o reranker falhar, a pesquisa volta silenciosamente à ordenação por semelhança e à respetiva pontuação mínima."
  text_helpdesk_kb_privacy_info: "Proteção de dados: o texto do problema/solução é enviado ao fornecedor de embeddings e guardado na base de dados vetorial. Com o reranker ativo, cada pesquisa envia adicionalmente o texto do ticket atual juntamente com os textos dos problemas das entradas candidatas - ou seja, conteúdo de outros tickets do mesmo projeto - ao fornecedor do reranker num único pedido; aí nada é guardado. Use endpoints próprios de embeddings e reranker para um fluxo totalmente local. O conhecimento é estritamente por projeto."
  field_helpdesk_kb_ingest_mode: "Contribuir para a base de conhecimento"
  text_helpdesk_kb_ingest_mode_info: "Se os tickets resolvidos deste projeto passam a ser entradas da base de conhecimento."
