  error_helpdesk_transport_not_available: "não está disponível para esta caixa de correio - o Graph só pode enviar por uma caixa de correio alojada no Microsoft 365 e apenas com um registo central de aplicação configurado"
  warning_helpdesk_sent_append_failed: "O e-mail foi enviado, mas não foi possível arquivar uma cópia na pasta de enviados: %{message}"
  text_helpdesk_reply_transport_info: "A opção «Backend da caixa de correio» usa aquilo para que a própria caixa de correio estiver configurada. A Graph API só é oferecida para uma caixa de correio IMAP alojada no Microsoft 365 (predefinição Microsoft em vigor) e requer um registo central da aplicação no Azure configurado. SMTP usa as configurações SMTP da configuração do Redmine e não precisa de nenhuma credencial de e-mail na caixa de correio - note que, nesse caso, as imagens inline são incorporadas como data URIs em vez de anexos CID. As respostas, os e-mails iniciais e a resposta automática seguem todos esta configuração."
