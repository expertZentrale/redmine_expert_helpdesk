  # AI summaries
  label_helpdesk_ai_settings: "Resumos por IA"
  field_helpdesk_ai_enabled: "Ativar resumos por IA"
  text_helpdesk_ai_enabled_info: "Interruptor principal. Os resumos têm ainda de ser ativados por projeto."
  field_helpdesk_ai_provider: "Fornecedor"
  label_helpdesk_ai_provider_openai: "OpenAI"
  label_helpdesk_ai_provider_anthropic: "Anthropic"
  label_helpdesk_ai_provider_custom: "Personalizado (compatível com OpenAI)"
  field_helpdesk_ai_api_key: "Chave de API"
  field_helpdesk_ai_endpoint: "Endpoint (URL base)"
  text_helpdesk_ai_endpoint_info: "Deixe vazio para usar a predefinição do fornecedor. Obrigatório para «Personalizado (compatível com OpenAI)» (URL próprio compatível com OpenAI, p. ex., Ollama/vLLM/LocalAI/LM Studio)."
  field_helpdesk_ai_model: "Modelo"
  text_helpdesk_ai_model_info: "ID do modelo. Para resumos, basta um modelo rápido e económico — p. ex., OpenAI gpt-4o-mini ou gpt-5-nano, Anthropic claude-haiku-4-5, ou um modelo alojado localmente como llama3.1. São suportados os modelos OpenAI GPT-5 / série o. Os anexos de imagem (visão) requerem um modelo com capacidade de visão (p. ex., gpt-4o-mini, gpt-5-nano, claude-haiku-4-5). Nos modelos de raciocínio (GPT-5/série o), mantenha «Máx. de tokens de saída» razoavelmente alto."
  field_helpdesk_ai_prompt: "Prompt"
  text_helpdesk_ai_prompt_info: "Instrução predefinida global. Os projetos podem expandi-la ou substituí-la."
  field_helpdesk_ai_max_input_chars: "Máx. de caracteres de entrada"
  field_helpdesk_ai_min_input_chars: "Mín. de caracteres de entrada"
  text_helpdesk_ai_max_input_chars_info: "O corpo do e-mail (e o texto dos anexos) é truncado para este comprimento antes do envio."
  text_helpdesk_ai_min_input_chars_info: "Os e-mails mais curtos do que isto não são enviados à IA; em vez disso, o texto original é publicado como nota. 0 = resumir sempre."
  field_helpdesk_ai_max_output_tokens: "Máx. de tokens de saída"
  field_helpdesk_ai_summary_disable_thinking: "Desativar o modo de raciocínio nos resumos"
  text_helpdesk_ai_summary_disable_thinking_info: "Pede aos modelos de raciocínio que respondam sem fase de raciocínio (chat_template_kwargs enable_thinking=false; vLLM/SGLang, p. ex., Qwen3). Só afeta o fornecedor «Personalizado (compatível com OpenAI)». Evita resumos vazios quando o modelo gasta toda a sua saída a raciocinar e poupa tempo e tokens."
  text_helpdesk_ai_thinking_kb_warning: "As propostas da base de conhecimento entram no resumo. Sem raciocínio, o modelo avalia mal se um caso anterior se aplica realmente: num teste com 20 tickets, acrescentou 9 vezes uma proposta de solução inadequada ou vazia (0 vezes com raciocínio). Mantenha o raciocínio permitido enquanto forem mostradas propostas da base de conhecimento no resumo."
  text_helpdesk_ai_summary_fallback: "Criado sem modo de raciocínio porque a primeira resposta estava vazia. As propostas da base de conhecimento não foram verificadas para este resumo."
  label_helpdesk_ai_thinking_central: "Configuração central (%{value})"
  label_helpdesk_ai_thinking_off: "Raciocínio desativado"
  label_helpdesk_ai_thinking_on: "Raciocínio permitido"
  field_helpdesk_ai_timeout: "Tempo limite (segundos)"
  text_helpdesk_ai_privacy_info: "Proteção de dados: o conteúdo dos e-mails recebidos e os anexos selecionados são enviados ao fornecedor configurado. Use o fornecedor «Personalizado (compatível com OpenAI)» com um endpoint próprio para um fluxo totalmente local."
  label_helpdesk_ai_summary: "Resumo por IA"
  label_helpdesk_ai_summary_skipped: "Resumo por IA omitido"
  text_helpdesk_ai_skipped_short: "O e-mail é mais curto do que o mínimo configurado de %{min} caracteres, pelo que não foi gerado nenhum resumo por IA – o texto original acima diz tudo."
  label_helpdesk_ai_assistant: "Assistente de IA"
  field_helpdesk_ai_summary_enabled: "Gerar resumos por IA para este projeto"
  text_helpdesk_ai_summary_enabled_info: "Adiciona uma nota privada de resumo aos tickets criados a partir de e-mails recebidos."
  field_helpdesk_ai_scope: "Âmbito"
  label_helpdesk_ai_scope_initial: "Só o e-mail inicial"
  label_helpdesk_ai_scope_initial_and_replies: "E-mail inicial e respostas"
  field_helpdesk_ai_prompt_mode: "Modo do prompt"
  label_helpdesk_ai_prompt_mode_inherit: "Usar prompt central"
  label_helpdesk_ai_prompt_mode_extend: "Expandir prompt central"
  label_helpdesk_ai_prompt_mode_override: "Substituir pelo prompt do projeto"
  text_helpdesk_ai_prompt_mode_info: "Como o prompt do projeto abaixo se combina com o prompt predefinido central."
  field_helpdesk_ai_attachments: "Enviar anexos à IA"
  label_helpdesk_ai_attach_metadata: "Nomes de ficheiro / metadados"
  label_helpdesk_ai_attach_text: "Texto extraído (PDF, ficheiros de texto)"
  label_helpdesk_ai_attach_images: "Imagens (requer modelo de visão)"
  text_helpdesk_ai_attachments_info: "Escolha que informações dos anexos são incluídas na entrada do resumo. As imagens requerem um modelo com capacidade de visão."
  field_helpdesk_ai_min_image_kb: "Tamanho mínimo das imagens"
  text_helpdesk_ai_min_image_kb_info: "Em KB. As imagens mais pequenas não são enviadas ao modelo - logótipos de assinatura, ícones de redes sociais e píxeis de rastreio acompanham quase todos os e-mails, gastam tokens inutilmente e retiram a captura de ecrã real do orçamento de imagens. As imagens com menos de 64x64 píxeis também são ignoradas. Aplica-se apenas a imagens; o texto e os metadados dos anexos não são afetados. 0 desativa o limiar."
  field_helpdesk_ai_include_journal: "Incluir todo o histórico do ticket"
  text_helpdesk_ai_include_journal_info: "Enviar a conversa completa (descrição + todas as notas) em vez de apenas o e-mail que a desencadeou. As notas de resumo por IA da própria extensão são excluídas."
  field_helpdesk_ai_include_private_notes: "Incluir também notas privadas"
  text_helpdesk_ai_include_private_notes_info: "Só se aplica quando todo o histórico é incluído. Nota: as notas privadas (internas) são então também enviadas ao fornecedor de IA."
