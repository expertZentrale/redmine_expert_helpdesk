  text_helpdesk_reply_status_info: "Pré-selecionado no campo de estado do ticket assim que «Enviar como e-mail ao cliente» é marcado. Uma sugestão, não uma regra: um estado escolhido por si é mantido e, nesse caso, desmarcar a caixa não o altera. Desmarcar só repõe o estado original enquanto não tiver escolhido um. Deixe vazio para não pré-selecionar nada."
