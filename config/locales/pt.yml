  text_helpdesk_info_request_note_visibility_info: "A nota regista que foi enviado um pedido de informações e o que foi pedido. A opção pública mantém agente e cliente com a mesma informação; a interna requer a permissão «Ver notas privadas»."
  text_helpdesk_info_request_enabled_info: "Interruptor principal. Quando está desligado, nenhum projeto executa a verificação, independentemente da sua configuração."
  text_helpdesk_info_request_mode_info: "Verifica apenas o PRIMEIRO e-mail de um novo ticket. «Baseado em regras» funciona sem IA; «Com IA» requer as configurações de IA acima."
  text_helpdesk_info_request_globally_off: "A verificação de completude está desligada centralmente (Administração → Extensões), pelo que estas configurações ainda não têm efeito."
  text_helpdesk_info_request_ai_unavailable: "A IA está desligada centralmente, pelo que «Com IA» não pode ser executado. Use o modo baseado em regras ou ative primeiro a IA."
  text_helpdesk_info_request_min_chars_info: "Os e-mails mais curtos do que isto contam como incompletos. O histórico citado e as assinaturas são removidos antes da medição. 0 desativa esta regra."
  text_helpdesk_info_request_min_words_info: "Igual ao anterior, contado em palavras. 0 desativa esta regra."
  text_helpdesk_info_request_require_attachment_info: "Considerar incompleto um e-mail sem qualquer anexo (captura de ecrã, registo, fotografia)."
  field_helpdesk_info_request_min_attachment_kb: "Tamanho mínimo das imagens"
  text_helpdesk_info_request_min_attachment_kb_info: "Em KB. As imagens mais pequenas não contam como captura de ecrã ou fotografia — logótipos de assinatura e píxeis de rastreio acompanham quase todos os e-mails. Aplica-se apenas a imagens; um registo ou PDF pequeno continua a contar. 0 desativa o limiar."
  field_helpdesk_info_request_sender_blacklist: "Nunca perguntar a estes remetentes"
  field_helpdesk_contact_info_request_opt_out: "Nunca pedir mais informações"
  label_helpdesk_contact_info_request_opt_out_short: "sem perguntas"
  button_helpdesk_contact_info_request_stop: "nunca perguntar"
  button_helpdesk_contact_info_request_resume: "voltar a perguntar"
  text_helpdesk_contact_info_request_resume_info: "Permitir que a verificação de completude volte a pedir informações em falta a este cliente."
  text_helpdesk_contact_info_request_opt_out_info: "Ninguém por detrás deste endereço responde a um pedido de informações: relatórios de cópias de segurança, alertas de monitorização, e-mails de cron. Os seus tickets continuam a ser criados e verificados quanto à completude, mas o cliente nunca é contactado por e-mail sobre isso. A mesma decisão para um endereço ou domínio inteiro pertence à configuração do projeto «Nunca perguntar a estes remetentes»."
  text_helpdesk_info_request_sender_blacklist_info: "Uma entrada por linha: endereço completo, domínio simples ou «@domínio». Relatórios de cópias de segurança, e-mails de cron e alertas de monitorização são tickets reais, mas ninguém por detrás deles pode responder a um pedido de informações. Os e-mails que se identificam nos cabeçalhos como gerados automaticamente são ignorados automaticamente, mesmo sem entrada aqui: Auto-Submitted, Precedence (bulk, list, junk), X-Auto-Response-Suppress, X-MS-Exchange-Generated-Message-Source e os cabeçalhos X-Autoreply/X-Autorespond/X-Autoresponder. As notificações de falha de entrega (NDR) não são ignoradas."
  text_helpdesk_info_request_keywords_info: "Um termo por linha. O e-mail tem de conter pelo menos um deles; caso contrário, conta como incompleto. Vazio desativa esta regra."
  text_helpdesk_info_request_threshold_info: "Quantas regras têm de falhar antes de se perguntar ao cliente. 1 = a primeira regra falhada já desencadeia um pedido de informações."
  text_helpdesk_info_request_ai_prompt_info: "O modelo tem de responder com JSON ({\"complete\": true|false, \"missing\": [...]}). Qualquer resposta ilegível conta como completa, pelo que não é enviado nenhum e-mail."
  text_helpdesk_info_request_subject_info: "São permitidas macros. Vazio usa o valor predefinido central."
  text_helpdesk_info_request_body_info: "São permitidas macros. {{missing_info}} insere a lista dos dados em falta. Vazio usa o valor predefinido central."
  text_helpdesk_info_request_status_info: "Opcional, p. ex., «A aguardar o cliente». Vazio mantém o estado inalterado. Os estados fechados não são oferecidos: fechar um ticket conta como reação e como resolução para o SLA, e um pedido de informações automático não pode fazer isso."
  text_helpdesk_info_request_reason_too_short: "Uma breve descrição do problema (o que exatamente não funciona?)"
  text_helpdesk_info_request_reason_too_few_words: "Mais alguns detalhes sobre o seu pedido"
  text_helpdesk_info_request_reason_no_attachment: "Uma captura de ecrã ou a mensagem de erro em ficheiro, se disponível"
