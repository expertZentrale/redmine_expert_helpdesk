  label_helpdesk_reply_status: "Estado al responder"
  text_helpdesk_reply_status_info: "Se preselecciona en el campo de estado del ticket en cuanto se marca «Enviar como correo al cliente». Es una sugerencia, no una regla: un estado que usted elija se mantiene, y desmarcar la casilla ya no lo modifica. Al desmarcarla, el estado original solo se restaura mientras usted no haya elegido uno. Déjelo vacío para no preseleccionar nada."
  label_helpdesk_default_assignee: "Asignar tickets nuevos a"
