  text_helpdesk_sent_folder_info: "Carpeta donde se archiva una copia del correo saliente, para que el buzón muestre ambas partes de la conversación. Déjelo vacío para que el servidor use su propia carpeta de enviados."
  error_helpdesk_transport_not_available: "no está disponible para este buzón: Graph solo puede enviar desde un buzón alojado en Microsoft 365 y solo con un registro central de aplicación configurado"
  warning_helpdesk_sent_append_failed: "El correo se envió, pero no se pudo archivar una copia en la carpeta de enviados: %{message}"
  text_helpdesk_reply_transport_info: "«Backend del buzón» usa lo que esté configurado en el propio buzón. Graph API solo se ofrece para un buzón IMAP alojado en Microsoft 365 (preajuste Microsoft en vigor) y requiere un registro central de aplicación en Azure configurado. SMTP usa la configuración SMTP de Redmine y no necesita ninguna credencial de correo en el buzón; tenga en cuenta que, en ese caso, las imágenes en línea se incrustan como data URI en lugar de como adjuntos CID. Las respuestas, los correos iniciales y la respuesta automática siguen todos esta opción."
