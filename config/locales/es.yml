  text_helpdesk_kb_tab_info: "Pares problema/solución extraídos de tickets resueltos. Solo las entradas aprobadas se usan para propuestas y borradores de respuesta. Al guardar una entrada se recalcula su vector: nunca edite las entradas directamente en la base de datos vectorial."
  text_helpdesk_kb_problem_info: "Solo el texto del problema se usa para la búsqueda por similitud; redáctelo como lo describiría un cliente."
  text_helpdesk_kb_status_info: "Las entradas aprobadas se pueden buscar de inmediato; las pendientes se guardan, pero no se usan."
  text_helpdesk_kb_issue_id_info: "Ticket de este proyecto en el que se basa la entrada (una entrada por ticket)."
  text_helpdesk_kb_reindex_info: "Vacía el almacén vectorial de este proyecto y vuelve a generar los embeddings de todas las entradas aprobadas (p. ej., tras cambiar el modelo de embeddings)."
  text_helpdesk_kb_reindex_confirm: "¿Reconstruir el índice vectorial de este proyecto? Las propuestas pueden estar incompletas hasta que finalice la reconstrucción."
  text_helpdesk_kb_reject_confirm: "¿Rechazar esta entrada? Se elimina de la búsqueda y no se volverá a crear automáticamente cuando se cierre de nuevo el ticket."
  text_helpdesk_kb_delete_confirm: "¿Borrar esta entrada definitivamente? El ticket puede volver a incorporarse la próxima vez que se cierre."
  text_helpdesk_kb_saved_not_indexed: "Guardado, pero no se pudo actualizar el vector (almacén o embeddings no accesibles/configurados). Use «Reconstruir índice» cuando estén disponibles."
  text_helpdesk_kb_problem_blank: "Guardado, pero no se puede buscar: el texto del problema está vacío."
  text_helpdesk_kb_unindex_failed: "No se pudo eliminar el vector del almacén (no accesible). La entrada se ha conservado; inténtelo de nuevo o use «Reconstruir índice» cuando el almacén esté disponible."
  notice_helpdesk_kb_saved_indexed: "Guardado y embedding regenerado."
  notice_helpdesk_kb_reindex_queued: "Reconstrucción del índice iniciada. Se ejecuta en segundo plano."
  button_helpdesk_kb_reextract: "Volver a extraer entradas"
  text_helpdesk_kb_reextract_info: "Vuelve a ejecutar la extracción con IA de las entradas con el nivel de detalle actual. Las entradas editadas, aprobadas o rechazadas por una persona no se modifican."
  text_helpdesk_kb_reextract_confirm: "%{count} entradas se extrajeron con otro nivel de detalle. ¿Volver a extraerlas con «%{level}»? Esto cuesta una llamada a la IA por entrada."
  text_helpdesk_kb_reextract_confirm_all: "¿Volver a extraer las %{count} entradas (no editadas por una persona) con «%{level}», p. ej., tras cambiar el prompt? Esto cuesta una llamada a la IA por entrada."
  notice_helpdesk_kb_reextract_queued: "Se ha iniciado la nueva extracción de %{count} entradas. Se ejecuta en segundo plano; las entradas conservan su estado."
  notice_helpdesk_kb_reextract_nothing: "No hay entradas que volver a extraer."

