  text_helpdesk_ai_regenerate_info: "Volver a resumir con la IA el correo inicial de este ticket (crea una nueva nota privada)."
  notice_helpdesk_ai_regenerate_queued: "El resumen con IA se está generando y aparecerá en breve."
