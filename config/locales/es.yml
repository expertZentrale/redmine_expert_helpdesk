  # AI summaries
  label_helpdesk_ai_settings: "Resúmenes con IA"
  field_helpdesk_ai_enabled: "Activar los resúmenes con IA"
  text_helpdesk_ai_enabled_info: "Interruptor general. Además, los resúmenes deben activarse en cada proyecto."
  field_helpdesk_ai_provider: "Proveedor"
  label_helpdesk_ai_provider_openai: "OpenAI"
  label_helpdesk_ai_provider_anthropic: "Anthropic"
  label_helpdesk_ai_provider_custom: "Personalizado (compatible con OpenAI)"
  field_helpdesk_ai_api_key: "Clave de API"
  field_helpdesk_ai_endpoint: "Endpoint (URL base)"
  text_helpdesk_ai_endpoint_info: "Déjelo vacío para usar el valor por defecto del proveedor. Obligatorio para «Personalizado» (URL autoalojada compatible con OpenAI, p. ej., Ollama/vLLM/LocalAI/LM Studio)."
  field_helpdesk_ai_model: "Modelo"
  text_helpdesk_ai_model_info: "ID del modelo. Para los resúmenes basta un modelo rápido y económico, p. ej., OpenAI gpt-4o-mini o gpt-5-nano, Anthropic claude-haiku-4-5, o un modelo autoalojado como llama3.1. Se admiten los modelos OpenAI GPT-5 / serie o. Los adjuntos de imagen (visión) requieren un modelo con capacidad de visión (p. ej., gpt-4o-mini, gpt-5-nano, claude-haiku-4-5). Con los modelos de razonamiento (GPT-5/serie o), mantenga «Máx. tokens de salida» razonablemente alto."
  field_helpdesk_ai_prompt: "Prompt"
  text_helpdesk_ai_prompt_info: "Instrucción global por defecto. Los proyectos pueden ampliarla o sustituirla."
  field_helpdesk_ai_max_input_chars: "Máx. caracteres de entrada"
  field_helpdesk_ai_min_input_chars: "Mín. caracteres de entrada"
  text_helpdesk_ai_max_input_chars_info: "El cuerpo del correo (y el texto de los adjuntos) se trunca a esta longitud antes de enviarse."
  text_helpdesk_ai_min_input_chars_info: "Los correos más cortos no se envían a la IA; en su lugar, el texto original se publica como nota. 0 = resumir siempre."
  field_helpdesk_ai_max_output_tokens: "Máx. tokens de salida"
  field_helpdesk_ai_summary_disable_thinking: "Desactivar el modo de pensamiento en los resúmenes"
  text_helpdesk_ai_summary_disable_thinking_info: "Pide a los modelos de razonamiento que respondan sin fase de pensamiento (chat_template_kwargs enable_thinking=false; vLLM/SGLang, p. ej., Qwen3). Solo afecta al proveedor «Personalizado» (compatible con OpenAI). Evita resúmenes vacíos cuando el modelo gasta toda su salida en razonar, y ahorra tiempo y tokens."
  text_helpdesk_ai_thinking_kb_warning: "Las propuestas de la base de conocimiento se incluyen en el resumen. Sin pensamiento, el modelo juzga mal si un caso anterior encaja de verdad: en una prueba con 20 tickets añadió 9 veces una propuesta de solución inadecuada o vacía (0 veces con pensamiento). Mantenga el pensamiento permitido mientras las propuestas de la base de conocimiento se muestren en el resumen."
  text_helpdesk_ai_summary_fallback: "Creado sin modo de pensamiento porque la primera respuesta estaba vacía. Las propuestas de la base de conocimiento no se comprobaron para este resumen."
  label_helpdesk_ai_thinking_central: "Configuración central (%{value})"
  label_helpdesk_ai_thinking_off: "Pensamiento desactivado"
  label_helpdesk_ai_thinking_on: "Pensamiento permitido"
  field_helpdesk_ai_timeout: "Tiempo de espera (segundos)"
  text_helpdesk_ai_privacy_info: "Protección de datos: el contenido de los correos entrantes y los adjuntos seleccionados se envían al proveedor configurado. Use el proveedor «Personalizado» con un endpoint autoalojado para un flujo totalmente local."
  label_helpdesk_ai_summary: "Resumen con IA"
  label_helpdesk_ai_summary_skipped: "Resumen con IA omitido"
  text_helpdesk_ai_skipped_short: "El correo es más corto que el mínimo configurado de %{min} caracteres, por lo que no se generó ningún resumen con IA: el texto original de arriba lo dice todo."
  label_helpdesk_ai_assistant: "Asistente de IA"
  field_helpdesk_ai_summary_enabled: "Generar resúmenes con IA en este proyecto"
  text_helpdesk_ai_summary_enabled_info: "Añade una nota privada con un resumen a los tickets creados a partir de correo entrante."
  field_helpdesk_ai_scope: "Alcance"
  label_helpdesk_ai_scope_initial: "Solo el correo inicial"
  label_helpdesk_ai_scope_initial_and_replies: "Correo inicial y respuestas"
  field_helpdesk_ai_prompt_mode: "Modo del prompt"
  label_helpdesk_ai_prompt_mode_inherit: "Usar el prompt central"
  label_helpdesk_ai_prompt_mode_extend: "Ampliar el prompt central"
  label_helpdesk_ai_prompt_mode_override: "Sustituir por el prompt del proyecto"
  text_helpdesk_ai_prompt_mode_info: "Cómo se combina el prompt del proyecto de abajo con el prompt central por defecto."
  field_helpdesk_ai_attachments: "Enviar adjuntos a la IA"
  label_helpdesk_ai_attach_metadata: "Nombres de archivo / metadatos"
  label_helpdesk_ai_attach_text: "Texto extraído (PDF, archivos de texto)"
  label_helpdesk_ai_attach_images: "Imágenes (requiere modelo de visión)"
  text_helpdesk_ai_attachments_info: "Elija qué información de los adjuntos se incluye en la entrada del resumen. Las imágenes requieren un modelo con capacidad de visión."
  field_helpdesk_ai_min_image_kb: "Tamaño mínimo de imagen"
  text_helpdesk_ai_min_image_kb_info: "En KB. Las imágenes más pequeñas no se envían al modelo: los logotipos de firma, los iconos de redes sociales y los píxeles de seguimiento cuelgan de casi todos los correos, cuestan tokens para nada y desplazan la captura de pantalla real del presupuesto de imágenes. Las imágenes de menos de 64x64 píxeles también se omiten. Solo se aplica a imágenes; el texto y los metadatos de los adjuntos no se ven afectados. 0 desactiva el umbral."
  field_helpdesk_ai_include_journal: "Incluir el historial completo del ticket"
  text_helpdesk_ai_include_journal_info: "Enviar toda la conversación (descripción + todas las notas) en lugar de solo el correo que la desencadena. Se excluyen las notas de resumen con IA del propio plugin."
  field_helpdesk_ai_include_private_notes: "Incluir también las notas privadas"
  text_helpdesk_ai_include_private_notes_info: "Solo se aplica cuando se incluye el historial completo. Nota: en ese caso, las notas privadas (internas) también se envían al proveedor de IA."
  label_helpdesk_ai_tokens: "tokens"
  label_helpdesk_ai_input_tokens: "Entrada"
  label_helpdesk_ai_output_tokens: "Salida"
