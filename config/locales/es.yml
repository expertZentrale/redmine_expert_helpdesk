  # Knowledge base (RAG)
  label_helpdesk_kb_settings: "Base de conocimiento (RAG)"
  field_helpdesk_kb_enabled: "Activar la base de conocimiento"
  text_helpdesk_kb_enabled_info: "Interruptor general. En cada proyecto se elige si aporta tickets resueltos y dónde aparecen las soluciones propuestas."
  field_helpdesk_kb_backend: "Almacén vectorial"
  text_helpdesk_kb_backend_info: "Qdrant (REST, sin gema adicional) o Postgres + pgvector (requiere la gema pg en el despliegue). Un espacio de nombres por proyecto: aislamiento estricto."
  field_helpdesk_kb_qdrant_url: "URL de Qdrant"
  text_helpdesk_kb_qdrant_url_info: "p. ej., http://qdrant:6333 (se usa cuando el almacén vectorial es Qdrant)."
  field_helpdesk_kb_qdrant_api_key: "Clave de API de Qdrant"
  field_helpdesk_kb_pg_url: "URL de conexión de pgvector"
  text_helpdesk_kb_pg_url_info: "p. ej., postgres://user:pass@host:5432/db (se usa cuando el almacén vectorial es pgvector; requiere la gema pg)."
  field_helpdesk_kb_embed_provider: "Proveedor de embeddings"
  field_helpdesk_kb_embed_model: "Modelo de embeddings"
  field_helpdesk_kb_embed_endpoint: "Endpoint de embeddings"
  text_helpdesk_kb_embed_endpoint_info: "Vacío = valor por defecto del proveedor. Obligatorio para un endpoint autoalojado compatible con OpenAI (Ollama/vLLM/LocalAI)."
  field_helpdesk_kb_embed_api_key: "Clave de API de embeddings"
  text_helpdesk_kb_embed_api_key_info: "Si se deja vacío, se reutiliza la clave de API del resumen cuando se usa el mismo proveedor. (Anthropic no tiene API de embeddings: use OpenAI o un endpoint autoalojado.)"
  field_helpdesk_kb_extract_prompt: "Prompt de extracción"
  text_helpdesk_kb_extract_prompt_info: "Déjelo vacío para usar el prompt integrado del nivel de detalle seleccionado (se muestra en gris). Su propio texto lo sustituye en todos los niveles y debe hacer que el modelo devuelva JSON."
  field_helpdesk_kb_extract_detail: "Nivel de detalle"
  label_helpdesk_kb_extract_detail_general: "General"
  label_helpdesk_kb_extract_detail_specific: "Específico"
  label_helpdesk_kb_extract_detail_most_specific: "Muy específico"
  label_helpdesk_kb_extract_detail_central: "Configuración central (%{level})"
  text_helpdesk_kb_extract_detail_info: "Cuánto detalle concreto conservan las entradas de la base de conocimiento. General: problema y solución generalizados. Específico: conserva nombres de aplicaciones, versiones, códigos y mensajes de error. Muy específico: conserva además rutas, nombres de servidores y recursos compartidos, valores de configuración y el orden exacto de los pasos. En todos los niveles se indica al modelo que omita contraseñas y datos personales. Se aplica a las entradas extraídas a partir de ahora; las existentes pueden volver a extraerse en la pestaña Base de conocimiento."
  text_helpdesk_kb_extract_prompt_project_info: "Prompt de extracción del proyecto, combinado con el prompt central del nivel de detalle efectivo según el modo del prompt. Con «Sustituir por el prompt del proyecto» debe hacer que el modelo devuelva JSON."
  field_helpdesk_kb_top_k: "Top-K"
  field_helpdesk_kb_min_score: "Puntuación mín."
  field_helpdesk_kb_min_results: "Resultados mín."
  text_helpdesk_kb_retrieval_info: "Recuperación: obtener hasta Top-K coincidencias y conservar las que alcancen la Puntuación mín.; proponer solo si quedan al menos Resultados mín."
  field_helpdesk_kb_rerank_enabled: "Usar reranker"
  text_helpdesk_kb_rerank_enabled_info: "Segunda fase de recuperación: un cross-encoder vuelve a puntuar la preselección del almacén vectorial. Notablemente más preciso que la similitud por sí sola, a costa de una solicitud adicional por búsqueda. Desactivado por defecto."
  field_helpdesk_kb_rerank_model: "Modelo de reranker"
  field_helpdesk_kb_rerank_endpoint: "Endpoint del reranker"
  text_helpdesk_kb_rerank_endpoint_info: "URL base sin /rerank. Déjelo vacío para usar el endpoint de embeddings: con la mayoría de los proveedores, ambos modelos están en la misma URL base."
  field_helpdesk_kb_rerank_api_key: "Clave de API del reranker"
  text_helpdesk_kb_rerank_api_key_info: "Déjelo vacío para usar la clave de API de embeddings."
  field_helpdesk_kb_rerank_candidates: "Candidatos"
  field_helpdesk_kb_rerank_min_score: "Puntuación mín. (rerank)"
  field_helpdesk_kb_rerank_timeout: "Tiempo de espera (s)"
  text_helpdesk_kb_rerank_scoring_info: "Se obtienen candidatos del almacén vectorial, se vuelven a puntuar y se conservan los mejores Top-K por encima de la puntuación mínima. Mientras el reranking está activo, este mínimo sustituye al de similitud de arriba: son escalas distintas y deben ajustarse por separado. Si el reranker falla, la búsqueda vuelve silenciosamente a la clasificación por similitud y a su puntuación mínima."
  text_helpdesk_kb_privacy_info: "Protección de datos: el texto del problema y la solución se envía al proveedor de embeddings y se almacena en la base de datos vectorial. Con el reranker activado, cada búsqueda envía además el texto del ticket actual junto con los textos del problema de las entradas candidatas (es decir, contenido de otros tickets del mismo proyecto) al proveedor del reranker en una sola solicitud; allí no se almacena nada. Use endpoints autoalojados de embeddings y reranker para un flujo totalmente local. El conocimiento está estrictamente separado por proyecto."
  field_helpdesk_kb_ingest_mode: "Aportar a la base de conocimiento"
  text_helpdesk_kb_ingest_mode_info: "Si los tickets resueltos de este proyecto se convierten en entradas de la base de conocimiento."
