  label_helpdesk_info_request_note_public: "Pública (el cliente también la ve)"
  label_helpdesk_info_request_note_private: "Interna (solo agentes)"
  text_helpdesk_info_request_note_visibility_info: "La nota deja constancia de que se envió un seguimiento y de lo que se pidió. La nota pública mantiene al agente y al cliente con la misma información; la interna requiere el permiso «Ver notas privadas»."
  text_helpdesk_info_request_enabled_info: "Interruptor general. Si está desactivado, ningún proyecto realiza la comprobación, independientemente de su configuración."
  text_helpdesk_info_request_mode_info: "Comprueba solo el PRIMER correo de un ticket nuevo. «Basado en reglas» funciona sin IA; «Asistido por IA» necesita la configuración de IA de arriba."
  text_helpdesk_info_request_globally_off: "La comprobación de completitud está desactivada de forma central (Administración → Extensiones), por lo que esta configuración aún no tiene efecto."
  text_helpdesk_info_request_ai_unavailable: "La IA está desactivada de forma central, por lo que «Asistido por IA» no puede ejecutarse. Use el modo basado en reglas o active primero la IA."
  text_helpdesk_info_request_min_chars_info: "Los correos más cortos se consideran incompletos. El historial citado y las firmas se eliminan antes de medir. 0 desactiva esta regla."
  text_helpdesk_info_request_min_words_info: "Igual que arriba, contado en palabras. 0 desactiva esta regla."
  text_helpdesk_info_request_require_attachment_info: "Considerar incompleto un correo sin ningún adjunto (captura de pantalla, log, foto)."
  field_helpdesk_info_request_min_attachment_kb: "Tamaño mínimo de imagen"
  text_helpdesk_info_request_min_attachment_kb_info: "En KB. Las imágenes más pequeñas no cuentan como captura de pantalla o foto: los logotipos de firma y los píxeles de seguimiento cuelgan de casi todos los correos. Solo se aplica a imágenes; un log o PDF pequeño sigue contando. 0 desactiva el umbral."
  field_helpdesk_info_request_sender_blacklist: "No preguntar nunca a estos remitentes"
  field_helpdesk_contact_info_request_opt_out: "No pedir nunca más información"
  label_helpdesk_contact_info_request_opt_out_short: "sin seguimiento"
  button_helpdesk_contact_info_request_stop: "no preguntar nunca"
  button_helpdesk_contact_info_request_resume: "volver a preguntar"
  text_helpdesk_contact_info_request_resume_info: "Permitir que la comprobación de completitud vuelva a pedir a este cliente la información que falta."
  text_helpdesk_contact_info_request_opt_out_info: "Nadie detrás de esta dirección responde a un seguimiento: informes de copia de seguridad, alertas de monitorización, correos de cron. Sus tickets se siguen creando y se sigue comprobando si están completos, pero nunca se escribe al cliente por ello. La misma decisión para una dirección o un dominio completos corresponde a la opción del proyecto «No preguntar nunca a estos remitentes»."
  text_helpdesk_info_request_sender_blacklist_info: "Una entrada por línea: dirección completa, dominio solo o \"@dominio\". Los informes de copia de seguridad, los correos de cron y las alertas de monitorización son tickets reales, pero nadie detrás de ellos puede responder a un seguimiento. Los correos que se identifican en sus cabeceras como generados automáticamente se omiten de forma automática, incluso sin una entrada aquí: Auto-Submitted, Precedence (bulk, list, junk), X-Auto-Response-Suppress, X-MS-Exchange-Generated-Message-Source y las cabeceras X-Autoreply/X-Autorespond/X-Autoresponder. Los informes de no entrega (NDR) no se omiten."
  text_helpdesk_info_request_keywords_info: "Un término por línea. El correo debe contener al menos uno de ellos; de lo contrario, se considera incompleto. Vacío desactiva esta regla."
  text_helpdesk_info_request_threshold_info: "Cuántas reglas deben fallar antes de preguntar al cliente. 1 = la primera regla que falla ya desencadena un seguimiento."
  text_helpdesk_info_request_ai_prompt_info: "El modelo debe responder con JSON ({\"complete\": true|false, \"missing\": [...]}). Todo lo que no se pueda leer se considera completo, de modo que no se envía ningún correo."
  text_helpdesk_info_request_subject_info: "Se permiten macros. Si está vacío, se usa el texto central por defecto."
  text_helpdesk_info_request_body_info: "Se permiten macros. {{missing_info}} inserta la lista de los datos que faltan. Si está vacío, se usa el texto central por defecto."
  text_helpdesk_info_request_status_info: "Opcional, p. ej., «Esperando al cliente». Vacío deja el estado sin cambios. Los estados cerrados no se ofrecen: cerrar un ticket cuenta para el SLA como reacción y como solución, y un seguimiento automático no debe hacer eso."
  text_helpdesk_info_request_reason_too_short: "Una breve descripción del problema (¿qué es exactamente lo que no funciona?)"
  text_helpdesk_info_request_reason_too_few_words: "Algunos detalles más sobre su solicitud"
  text_helpdesk_info_request_reason_no_attachment: "Una captura de pantalla o el mensaje de error como archivo, si lo tiene"
  text_helpdesk_info_request_reason_no_keyword: "El sistema, la aplicación o el dispositivo afectado"
  note_helpdesk_info_request_sent: "Seguimiento automático enviado a %{email}: el correo inicial no contenía suficiente información."
  label_helpdesk_ai_stats_type_completeness: "Comprobación de completitud"

