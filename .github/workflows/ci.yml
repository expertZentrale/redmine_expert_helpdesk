name: CI

# Runs the plugin tests (MiniTest, unit + integration) against every supported
# Redmine version in a clean environment. Each matrix entry checks Redmine out
# fresh, copies the plugin in, migrates an empty database and then starts
# `redmine:plugins:test`. MariaDB runs on every version; MySQL and PostgreSQL
# on the oldest and the newest, which catches SQL only one of them accepts.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Aeltere Laeufe desselben Branches/PRs abbrechen, sobald ein neuer startet.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Redmine ${{ matrix.redmine }} · Ruby ${{ matrix.ruby }} · ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { redmine: '5.1-stable', ruby: '3.2', db: 'mariadb' }
          - { redmine: '6.0-stable', ruby: '3.3', db: 'mariadb' }
          - { redmine: '6.1-stable', ruby: '3.3', db: 'mariadb' }
          - { redmine: '7.0-stable', ruby: '3.4', db: 'mariadb' }
          - { redmine: '5.1-stable', ruby: '3.2', db: 'mysql' }
          - { redmine: '7.0-stable', ruby: '3.4', db: 'mysql' }
          - { redmine: '5.1-stable', ruby: '3.2', db: 'postgresql' }
          - { redmine: '7.0-stable', ruby: '3.4', db: 'postgresql' }

    env:
      RAILS_ENV: test
      # Redmine liest config/database.yml schon beim `bundle install`, um den
      # DB-Adapter (mysql2 / pg) zu bestimmen — daher unten vor dem Bundle schreiben.
      REDMINE_DIR: redmine


    steps:
      # 1. Redmine-Core in der passenden stabilen Version auschecken.
      - name: Checkout Redmine ${{ matrix.redmine }}
        uses: actions/checkout@v4
        with:
          repository: redmine/redmine
          ref: ${{ matrix.redmine }}
          path: ${{ env.REDMINE_DIR }}

      # 2. Dieses Plugin in den Plugin-Ordner von Redmine legen.
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: ${{ env.REDMINE_DIR }}/plugins/redmine_expert_helpdesk

      # 3. Native Abhaengigkeiten fuer mysql2 / pg (und rmagick, falls im Bundle).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev libpq-dev libmagickwand-dev imagemagick pkg-config

      # The database of this matrix entry, started here rather than as a service
      # container so each entry gets only the one it tests.
      - name: Start ${{ matrix.db }}
        run: |
          case "${{ matrix.db }}" in
            mariadb)
              docker run -d --name db -p 3306:3306 -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=redmine_test \
                mariadb:11.4
              ready() { docker exec db healthcheck.sh --connect --innodb_initialized; } ;;
            mysql)
              docker run -d --name db -p 3306:3306 -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=redmine_test \
                mysql:8.4
              ready() { docker exec db mysql -uroot -proot -h127.0.0.1 -e 'SELECT 1'; } ;;
            postgresql)
              docker run -d --name db -p 5432:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=redmine_test \
                postgres:17
              ready() { docker exec db pg_isready -h 127.0.0.1 -U postgres; } ;;
          esac
          for i in $(seq 60); do ready >/dev/null 2>&1 && exit 0; sleep 2; done
          docker logs db; exit 1

      # 4. Ruby einrichten (Bundle-Cache haengt an Redmine-Ref + Ruby-Version).
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      # 5. Test-Datenbank konfigurieren (MySQL/MariaDB mit utf8mb4 und READ-COMMITTED
      #    wie von Redmine empfohlen, PostgreSQL mit utf8). Muss vor `bundle install`
      #    existieren.
      - name: Write database.yml
        working-directory: ${{ env.REDMINE_DIR }}
        run: |
          if [ "${{ matrix.db }}" = postgresql ]; then
            cat > config/database.yml <<'YML'
          test:
            adapter: postgresql
            database: redmine_test
            host: 127.0.0.1
            port: 5432
            username: postgres
            password: postgres
            encoding: utf8
          YML
          else
            cat > config/database.yml <<'YML'
          test:
            adapter: mysql2
            database: redmine_test
            host: 127.0.0.1
            port: 3306
            username: root
            password: root
            encoding: utf8mb4
            variables:
              transaction_isolation: "READ-COMMITTED"
          YML
          fi

      # Native gems (mysql2, rmagick) link against the runner's system libraries, so a
      # bundle cached on an older runner image fails to load (libmysqlclient.so.21 was
      # gone after the image update in 2026-11). Key the cache on the image as well.
      - name: Runner image version
        run: echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      # 6. Gems cachen (Redmine committet keine Gemfile.lock, daher Key ueber Ref).
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: ${{ env.REDMINE_DIR }}/vendor/bundle
          key: gems-${{ env.RUNNER_IMAGE }}-${{ matrix.redmine }}-ruby${{ matrix.ruby }}-${{ matrix.db }}-${{ hashFiles(format('{0}/Gemfile', env.REDMINE_DIR)) }}
          restore-keys: |
            gems-${{ env.RUNNER_IMAGE }}-${{ matrix.redmine }}-ruby${{ matrix.ruby }}-${{ matrix.db }}-

      # 7. Gems installieren (ohne development-Gruppe; test-Gruppe wird gebraucht).
      - name: Install gems
        working-directory: ${{ env.REDMINE_DIR }}
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local without 'development'
          bundle install --jobs 4 --retry 3

      # 8. Saubere Umgebung aufbauen: Secret-Token, Core-Migrationen,
      #    danach die Plugin-Migrationen.
      - name: Prepare Redmine
        working-directory: ${{ env.REDMINE_DIR }}
        run: |
          bundle exec rake generate_secret_token
          bundle exec rake db:create db:migrate
          bundle exec rake redmine:plugins:migrate NAME=redmine_expert_helpdesk

      # 9. Plugin-Tests (unit + integration) ausfuehren.
      - name: Run plugin tests
        working-directory: ${{ env.REDMINE_DIR }}
        run: bundle exec rake redmine:plugins:test NAME=redmine_expert_helpdesk

      # An integration test that gets a 500 only reports the status; the exception
      # behind it is in the test log, after the request id ("[uuid] Foo::Error (...)").
      - name: Exceptions from the test log
        if: failure()
        working-directory: ${{ env.REDMINE_DIR }}
        run: |
          grep -n -A 12 -E '[A-Z][A-Za-z]+(::[A-Z][A-Za-z]+)*(Error|Invalid|Exception) \(' \
            log/test.log | head -n 400 || true
